<!-- This page's own controls: mirrors js/profile.js's own wiring against a
     second set of ids, and adds the identity status this profile system
     otherwise has no page for. Page-owned per rux-ds's ownership split —
     "each app owns its nav and content" — not something account.js should
     carry, since no other app needs this markup. -->
<script>
(() => {
  'use strict';
  const profile = window.Rux?.profile;
  if (!profile) return;

  const nameInput = document.getElementById('acct-name');
  const themeRadios = [...document.querySelectorAll('input[name="acct-theme"]')];
  const avatar = document.getElementById('acct-avatar');

  const initials = name => {
    const words = (name ?? '').trim().split(/\s+/).filter(Boolean);
    if (!words.length) return '?';
    return words.length === 1 ? words[0].slice(0, 2).toUpperCase() : (words[0][0] + words[1][0]).toUpperCase();
  };
  // No captured reference hashes a name to one of the twelve order classes;
  // this is this page's own choice, stable per id, not a Carbon behaviour.
  // Full class names, not built from a suffix: tools/check.mjs matches
  // rux--* substrings statically and cannot see through concatenation.
  const ORDER_CLASSES = [
    'rux--user-avatar--order-1-cyan', 'rux--user-avatar--order-2-gray', 'rux--user-avatar--order-3-green',
    'rux--user-avatar--order-4-magenta', 'rux--user-avatar--order-5-purple', 'rux--user-avatar--order-6-teal',
    'rux--user-avatar--order-7-cyan', 'rux--user-avatar--order-8-gray', 'rux--user-avatar--order-9-green',
    'rux--user-avatar--order-10-magenta', 'rux--user-avatar--order-11-purple', 'rux--user-avatar--order-12-teal',
  ];
  const colourFor = seed => {
    let h = 0;
    for (const ch of seed ?? '') h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return ORDER_CLASSES[h % ORDER_CLASSES.length];
  };

  let currentOrderClass = null;
  const renderProfile = (p, seed) => {
    if (nameInput && document.activeElement !== nameInput) nameInput.value = p.name ?? '';
    const current = document.documentElement.dataset.theme ?? '';
    for (const r of themeRadios) r.checked = r.value === current;
    if (avatar) {
      avatar.textContent = initials(p.name);
      const next = colourFor(seed ?? p.name ?? '');
      if (next !== currentOrderClass) {
        if (currentOrderClass) avatar.classList.remove(currentOrderClass);
        avatar.classList.add(next);
        currentOrderClass = next;
      }
    }
  };

  nameInput?.addEventListener('input', () => profile.set({ name: nameInput.value }));
  for (const r of themeRadios) r.addEventListener('change', () => {
    if (!r.checked) return;
    document.documentElement.dataset.theme = r.value;
    profile.set({ theme: r.value });
  });
  profile.onChange(p => renderProfile(p));
  renderProfile(profile.get());

  // Connected accounts: window.Rux.account is account.js's, loaded just
  // before this block. Absent entirely if account.js bailed out early (no
  // window.supabase, no profile) — the tag then just keeps reading
  // "Checking…", which is honest: this page cannot tell either way.
  // ONE ENTRY PER PROVIDER, and nothing below names a provider: `who` is the
  // only per-provider knowledge left, because GitHub's identity_data carries
  // a login under user_name and Google's does not.
  const PROVIDERS = [
    { id: 'github', who: d => d?.user_name ?? d?.email },
    { id: 'google', who: d => d?.email ?? d?.name },
  ];
  const rows = PROVIDERS.map(p => ({
    ...p,
    tag: document.getElementById(`acct-${p.id}-tag`),
    connectBtn: document.getElementById(`acct-${p.id}-connect`),
  })).filter(r => r.tag);
  const signOutBtn = document.getElementById('acct-signout');
  const signOutNote = document.getElementById('acct-signout-note');

  const account = window.Rux?.account;
  if (!account || !rows.length) return;

  // NO SESSION IS ITS OWN STATE, not the same as "anonymous, not yet
  // linked" — Turnstile can fail (localhost, an ad blocker, a slow
  // network) and leave account.js never signing in at all. Offering
  // "Connect GitHub" then would try to link an identity onto a session
  // that does not exist.
  const label = (row, text) => { row.tag.querySelector('.rux--tag__label').textContent = text; };

  account.getSession().then(session => {
    if (avatar && session) renderProfile(profile.get(), session.user.id);
    if (!session) {
      for (const row of rows) label(row, 'Signed out');
      return;
    }
    // SIGN OUT BELONGS TO THE SESSION: it shows when ANY identity is linked,
    // since that is when signing out can lose something worth warning about.
    let linked = false;
    for (const row of rows) {
      const identity = session.user.identities?.find(i => i.provider === row.id);
      row.tag.className = identity ? 'rux--tag rux--tag--green' : 'rux--tag rux--tag--gray';
      const who = row.who(identity?.identity_data);
      label(row, identity ? (who ? `Connected as ${who}` : 'Connected') : 'Not connected');
      if (identity) linked = true;
      // An anonymous session can link any provider it has not linked yet; a
      // permanent one is left alone here, as it was with one provider.
      else if (session.user.is_anonymous !== false && row.connectBtn) row.connectBtn.hidden = false;
    }
    if (linked) {
      if (signOutBtn) signOutBtn.hidden = false;
      if (signOutNote) signOutNote.hidden = false;
    }
  }, () => {
    for (const row of rows) label(row, 'Unknown');
  });

  for (const row of rows) row.connectBtn?.addEventListener('click', () => { account.connect(row.id).catch(() => {}); });
  signOutBtn?.addEventListener('click', async () => {
    await account.signOut().catch(() => {});
    location.reload();
  });
})();
</script>
</body>
</html>
