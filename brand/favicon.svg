<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Rux">
<title>Rux</title>
<!-- The favicon's drawing, by rux on 2026-09-07: the dachshund padded back
     inside a safe area, and the SAME drawing brand/logo.svg carries. The
     edge-to-edge mark earlier that day was 124 cells and bled left and right;
     this one is narrower by two columns, taken out of the back rather than
     the snout, so the head, the ear and the three-cell muzzle are untouched.
     114 filled cells, bounds x=1..15 and y=1..15: ONE CELL OF AIR ON
     EVERY SIDE, so the mark is square and inside the 28-of-32 safe area an
     icon wants. The 16 columns go tail 1, back 2, ear 2, ear gap 1, head 5,
     muzzle 3, with a column spare on each edge. Measured against the masks a
     launcher actually applies, it loses NO cells to a circular mask, to an
     iOS superellipse or to the 28-of-32 area; the edge-to-edge mark it
     replaces lost 3, 0 and 8.
     The legs and the tail are ONE cell wide, and that is rux's considered
     choice: in Chrome, across the two leg rows, 16 CSS pixels give 4 solid
     device pixels alternating with single gaps, and 20 pixels give 2 solid
     against 14 partly transparent, which reads as a grey band rather than as
     four legs. 17 one-cell-wide strokes. Whole-pixel sizes are exact.
     One path, 3 closed loops: the boundary of the filled region rather
     than abutting rectangles, which anti alias their shared edges at
     fractional scales. Default nonzero fill; the outer loop winds clockwise
     and the two counters anticlockwise. 0 partly transparent pixels at 16,
     32, 48 and 64; 85 at 20 and 72 at 24, against 88 and 93 for the wider
     drawing, so the padding costs nothing at a fractional size and gains
     there.
     Not generated from the logo; tools/make-marks.mjs reads this file and
     checks it, and writes nothing here. The two files are kept identical by
     hand, and nothing enforces it.
     Self themed because a favicon gets no CSS from the page: gray-100 on
     a light tab strip, gray-10 on a dark one. -->
<style>
svg{fill:#161616}
@media (prefers-color-scheme:dark){svg{fill:#f4f4f4}}
</style>
<path d="M7 1L12 1L12 4L15 4L15 7L12 7L12 13L11 13L11 15L10 15L10 13L9 13L9 15L8 15L8 13L6 13L6 15L5 15L5 13L4 13L4 15L3 15L3 13L2 13L2 9L1 9L1 4L2 4L2 8L7 8L7 3L6 3L6 7L4 7L4 2L7 2ZM9 2L8 2L8 4L9 4ZM11 2L10 2L10 4L11 4Z"/>
</svg>
