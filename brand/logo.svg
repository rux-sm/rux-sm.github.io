<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#f4f4f4">
<title>Rux</title>
<!-- Official mark from rux-logo-16x16.svg, drawn by rux on a 16-pixel grid
     on 2026-09-06; supersedes Brand.svg. Visible geometry and placement
     preserved exactly: the export's 21 overlapping shapes, one carrying a
     stray fractional point on a straight edge, reduce to these 15 rectangles,
     and the set of filled cells was compared before and after.
     110 filled cells, bounds x=1..14 and y=1..14: one cell of air on every
     side, so the mark is square. Gray-10 for dark surfaces; generated light
     icons use gray-100. Whole device pixels at sizes divisible by 16. The 24
     CSS-pixel header has 1.5px cells at 1x and 3px cells at 2x. -->
