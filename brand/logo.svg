<title>Rux</title>
<!-- gray-10 #f4f4f4, the shell header's own text colour: the header is
     #161616 in all four themes, measured, so one colourway serves every
     theme and the mark reads level with the wordmark beside it. 16.45:1.
     Black as exported measured 1.16:1 and was invisible.
     Drawn on a 16-module grid (every coordinate is a multiple of 64), ink
     14x12 modules centred in the square canvas. 1.5px per module at the
     24px header slot, so whole pixels at 16, 32, 48 and 64 but not 20/24. -->
