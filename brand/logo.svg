<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
<title>Rux logo placeholder</title>
<!-- PLACEHOLDER, not a mark. A 24x24 dashed box reserving Carbon's icon-scale
     footprint in the shell header, drawn in the header's own #f4f4f4 at 60%.
     It carries no ARIA: every page embeds it with an img tag whose alt is
     empty, beside the product name in text, so it is decorative and the alt
     is what assistive technology reads.
     Swap this whole file for the finished logo. No other file changes. -->
<rect x=".5" y=".5" width="23" height="23" fill="none"
      stroke="#f4f4f4" stroke-opacity=".6" stroke-dasharray="3 2"/>
</svg>
