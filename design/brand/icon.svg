<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
<!-- The app tile icon: the Rux mark, the same three rectangles as
     brand/favicon.svg on the 16 grid, because the tile is 32 pixels, a
     multiple of 16. It is a CSS mask over the tile's text colour, so this
     file's own colours are discarded and only its alpha is read; that is why
     it carries no fill and no title. -->
