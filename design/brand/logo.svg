<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#f4f4f4">
<title>Rux</title>
<!-- Official mark, the dachshund redrawn by rux on 2026-09-10. Byte for byte
     the same geometry as brand/favicon.svg: one drawing for the header, the
     tab strip and the app icons.
     It replaces the 2026-09-07 revision, which had 114 cells. This one is
     lighter at 97, keeping the head, the ear and the three cell muzzle and
     taking the weight out of the back and the legs.
     PORTED, NOT REDRAWN HERE. rux exported it on a 67 unit artboard whose
     grid step was 4.1667, so no size rendered on whole pixels. Every
     coordinate in that export was an exact multiple of the step, so the port
     is a division: each landed on a whole cell of this 16 grid with nothing
     rounded away, and the geometry is rux's own, unchanged.
     97 filled cells, bounds x=1..15 and y=2..14: ONE CELL OF AIR left and
     right, TWO top and bottom. Measured against the masks a launcher
     actually applies, it loses NO cells to a circular mask, to an iOS
     superellipse or to the 28 of 32 safe area, the same as the mark it
     replaces.
     One path, 3 closed loops, and the winding is load bearing: the outer
     loop runs anticlockwise and the two eye counters clockwise, so under the
     default nonzero fill the eyes stay holes. Checked both ways, even odd
     and nonzero, and both count 97.
     Gray 10 for dark surfaces; generated light icons use gray 100. Whole
     device pixels at sizes divisible by 16. The 24 CSS pixel header has
     1.5px cells at 1x and 3px cells at 2x. -->
<path d="M7 2L12 2L12 5L15 5L15 8L11 8L11 13L10 13L10 14L9 14L9 13L8 13L8 14L7 14L7 13L5 13L5 14L4 14L4 13L3 13L3 14L2 14L2 13L1 13L1 6L2 6L2 9L7 9L7 4L6 4L6 8L4 8L4 3L7 3L7 2ZM9 3L8 3L8 5L9 5L9 3ZM11 3L10 3L10 5L11 5L11 3Z"/>
</svg>
