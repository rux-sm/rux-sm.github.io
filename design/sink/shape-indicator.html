<section class="ks-sec" id="shape-indicator">
  <h2>Shape indicator</h2><p>status by shape, so colour is never the only signal</p>
  <!-- PROVENANCE: rendered-dom · react.carbondesignsystem.com
     preview-statusindicators-preview-shapeindicator--default, 2026-08-27
     · status modifier sits on the SVG, base on the wrapper div, per the reference.
     · --incomplete renders black here: its only rule is
       `path:nth-of-type(2) { fill: status-blue }`, which the sprite blocks. -->
  <!--
    --incomplete HAS NO DIRECT FILL. Its only rule is
    `.rux--shape-indicator--incomplete path:nth-of-type(2) { fill: status-blue }`,
    so the shape is meant to be an outline with one blue path inside. Through the
    sprite that selector reaches nothing and the icon renders in the inherited
    colour. Same root cause as the note in icon-indicator.html.
  -->
  <!-- Icon per status from web-components/shape-indicator.js:55-65. The --kind
       class supplies `fill` only; the shape itself must be the right SVG. -->
  <div class="ks-row">
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--failed" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-critical"/></svg>Failed</div>
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--critical" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-critical-severity"/></svg>Critical</div>
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--high" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-caution"/></svg>High</div>
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--medium" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-diamond-fill"/></svg>Medium</div>
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--low" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-low-severity"/></svg>Low</div>
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--cautious" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-caution"/></svg>Cautious</div>
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--stable" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-circle-fill"/></svg>Stable</div>
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--informative" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-low-severity"/></svg>Informative</div>
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--incomplete" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-incomplete"/></svg>Incomplete</div>
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--draft" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-circle-stroke"/></svg>Draft</div>
    <div class="rux--shape-indicator"><svg class="rux--shape-indicator--undefined" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-diamond-fill"/></svg>Undefined</div>
  </div>
  <div class="ks-label">14px text</div>
  <div class="ks-row">
    <div class="rux--shape-indicator rux--shape-indicator--14"><svg class="rux--shape-indicator--stable" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-circle-fill"/></svg>Stable</div>
    <div class="rux--shape-indicator rux--shape-indicator--14"><svg class="rux--shape-indicator--informative" width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-low-severity"/></svg>Informative</div>
  </div>
</section>
