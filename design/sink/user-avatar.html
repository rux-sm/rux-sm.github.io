<section class="ks-sec" id="user-avatar">
  <h2>User avatar</h2><p>initials · four sizes · the twelve colour orders</p>
  <!-- PROVENANCE: rendered-dom · components-useravatar--default and
       --with-image on the ibm-products origin, 2026-08-31 -->
  <!--
    THE ONLY FRAGMENT WHOSE REFERENCE IS `c4p--` RATHER THAN `cds--`, and that
    needs saying because it looks like a provenance fault and is not.
    `user-avatar` was ABSORBED OUT OF ibm-products into @carbon/styles with
    Carbon 1.114 — src/app.scss records the same for the other seven arrivals —
    so the component now compiles here under `rux--`, while the only captured
    STORIES of it are still the ibm-products ones that render `c4p--`.

    THE TWO SETS WERE CHECKED AGAINST EACH OTHER RATHER THAN ASSUMED TO MATCH.
    Five of the six classes the capture renders resolve after a prefix swap —
    `user-avatar`, `--md`, `--order-1-cyan`, `__photo`, `__photo--md`. The
    sixth, `user-avatar__tooltip`, does NOT: it is ibm-products' own wrapper
    for the hover hint, which this sink declines everywhere anyway.

    NO MODULE. An avatar displays; it has no state and nothing to drive. The
    capture wraps it in a tooltip trigger button, which is the story showing a
    name on hover, not the component.

    THE PHOTO VARIANTS follow the `--with-image` story: an `<img>` with
    `__photo` and its size class inside the avatar, one per size. The picture
    is invented and drawn inline, so the sink still loads no image file.

    THE COLOUR IS THE CONSUMER'S CHOICE, not a state. Carbon ships twelve
    `--order-N-*` classes and its own story renders only `--order-1-cyan`;
    they exist so an application can hash a name onto a stable colour. All
    twelve are demoed here because that is the whole of what the component
    offers beyond size.
  -->
