  <rect x="22" y="30" width="8" height="34" style="fill:var(--emu-console-blue)"/>
  <rect x="66" y="30" width="18" height="34" rx="8" style="fill:var(--emu-console-red)"/>
  <rect x="66" y="30" width="8" height="34" style="fill:var(--emu-console-red)"/>
  <rect x="30" y="30" width="36" height="34" style="fill:var(--emu-console-shade)"/>
  <rect x="33" y="33" width="30" height="28" style="fill:var(--emu-console-screen)"/>
  <circle cx="21" cy="40" r="3" style="fill:var(--emu-console-ink)"/>
  <circle cx="75" cy="52" r="3" style="fill:var(--emu-console-ink)"/>
  <circle cx="21" cy="53" r="1.6" style="fill:var(--emu-console-ink)"/>
  <circle cx="75" cy="40" r="1.6" style="fill:var(--emu-console-ink)"/>
