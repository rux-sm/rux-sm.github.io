  <rect x="35" y="13" width="26" height="22" rx="2" style="fill:var(--emu-console-ink)"/>
  <rect x="38" y="16" width="20" height="16" style="fill:var(--emu-console-screen)"/>
  <rect x="35" y="44" width="12" height="4" style="fill:var(--emu-console-ink)"/>
