<svg xmlns="http://www.w3.org/2000/svg">
<!-- Emu's consoles, one symbol per system, each standing on the foot of a 96 by 64 box.
     Every fill is one of the emu-console properties, which app.css sets from Design's
     tokens, so a console follows the theme; a console's own screen is emu-console-screen. -->
<symbol id="nes" viewBox="0 0 96 64"><title>NES</title>
  <rect x="6" y="32" width="84" height="32" rx="2" style="fill:var(--emu-console-body)"/>
  <rect x="6" y="32" width="84" height="12" rx="2" style="fill:var(--emu-console-shade)"/>
  <rect x="14" y="48" width="46" height="10" rx="1" style="fill:var(--emu-console-detail)"/>
  <rect x="66" y="50" width="8" height="4" style="fill:var(--emu-console-red)"/>
  <rect x="78" y="50" width="8" height="4" style="fill:var(--emu-console-ink)"/>
</symbol>
<symbol id="snes" viewBox="0 0 96 64"><title>SNES</title>
  <rect x="8" y="38" width="80" height="26" rx="4" style="fill:var(--emu-console-body)"/>
  <rect x="24" y="30" width="48" height="14" rx="3" style="fill:var(--emu-console-shade)"/>
  <rect x="31" y="33" width="34" height="5" rx="1" style="fill:var(--emu-console-detail)"/>
  <rect x="14" y="50" width="14" height="6" rx="3" style="fill:var(--emu-console-purple)"/>
  <rect x="68" y="50" width="14" height="6" rx="3" style="fill:var(--emu-console-purple)"/>
</symbol>
<symbol id="n64" viewBox="0 0 96 64"><title>N64</title>
  <path d="M4 64 14 40q2-4 6-4h56q4 0 6 4l10 24z" style="fill:var(--emu-console-shade)"/>
  <rect x="32" y="30" width="32" height="10" rx="2" style="fill:var(--emu-console-body)"/>
  <rect x="20" y="43" width="9" height="4" rx="2" style="fill:var(--emu-console-red)"/>
  <circle cx="24" cy="55" r="3" style="fill:var(--emu-console-detail)"/>
  <circle cx="40" cy="55" r="3" style="fill:var(--emu-console-detail)"/>
  <circle cx="56" cy="55" r="3" style="fill:var(--emu-console-detail)"/>
  <circle cx="72" cy="55" r="3" style="fill:var(--emu-console-detail)"/>
</symbol>
<symbol id="gc" viewBox="0 0 96 64"><title>GameCube</title>
  <path d="M36 22v-8h24v8h-3v-5H39v5z" style="fill:var(--emu-console-shade)"/>
  <rect x="26" y="20" width="44" height="44" rx="4" style="fill:var(--emu-console-purple)"/>
  <circle cx="48" cy="40" r="14" style="fill:var(--emu-console-ink);fill-opacity:0.3"/>
  <circle cx="48" cy="40" r="5" style="fill:var(--emu-console-body)"/>
  <rect x="32" y="57" width="7" height="3" style="fill:var(--emu-console-ink);fill-opacity:0.4"/>
  <rect x="43" y="57" width="7" height="3" style="fill:var(--emu-console-ink);fill-opacity:0.4"/>
  <rect x="54" y="57" width="7" height="3" style="fill:var(--emu-console-ink);fill-opacity:0.4"/>
</symbol>
<symbol id="wii" viewBox="0 0 96 64"><title>Wii</title>
