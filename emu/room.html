<main id="main-content" class="rux--content emu-main">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--col-span-100">
      <div class="rux--stack-vertical rux--stack-scale-6">
        <h1 id="emu-title">Library</h1>
        <div id="emu-error" hidden>
          <div class="rux--inline-notification rux--inline-notification--error" role="alert">
            <div class="rux--inline-notification__details">
              <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-error-fill"/></svg>
              <div class="rux--inline-notification__text-wrapper"><div class="rux--inline-notification__title"></div></div>
            </div>
          </div>
        </div>
        <div id="emu-empty" hidden>
          <p>No scan yet. <a class="rux--link" href="status.html">Update</a> scans the drive.</p>
        </div>

        <!-- Your Mac, from room.js, shown where Rux Emu Helper answers: one scene that
             stays in view. A TV and this Mac's consoles stand on a board over a power
             strip; its games stand on the same board, the favourites on a shelf above. -->
        <section class="emu-room" id="emu-room" aria-labelledby="emu-room-h" hidden>
          <div class="emu-room__head">
            <h2 class="rux--type-heading-03" id="emu-room-h">Your Mac</h2>
            <a class="rux--link" href="status.html" id="emu-room-health"></a>
            <!-- What a move just did, from room.js, with Undo where it can be taken back. -->
            <p class="emu-room__said"><span role="status" id="emu-room-said"></span>
              <button type="button" class="rux--btn rux--btn--sm rux--layout--size-sm rux--btn--ghost" id="emu-room-undo" hidden>Undo</button></p>
            <p class="emu-row__sub emu-room__space" id="emu-room-space"></p>
          </div>
          <div class="emu-scene">
            <div class="emu-stage">
              <div class="emu-tv" aria-hidden="true"><div class="emu-tv__screen"></div></div>
              <ul class="emu-stand" role="list" id="emu-stand" aria-label="Consoles on this Mac"></ul>
            </div>
            <div class="emu-side">
              <div class="emu-wall">
                <ul class="emu-ledge" role="list" id="emu-ledge" aria-labelledby="emu-ledge-h"></ul>
                <p class="emu-cap" id="emu-ledge-h">Favourites</p>
              </div>
              <div>
                <ul class="emu-onmac" role="list" id="emu-onmac" aria-labelledby="emu-onmac-h"></ul>
                <p class="emu-cap emu-cap--under" id="emu-onmac-h"></p>
              </div>
            </div>
          </div>
        </section>

        <!-- Rux's Collection, from room.js: every console with games, then the picked
             console's games as covers in one row. -->
        <section class="rux--stack-vertical rux--stack-scale-5" id="emu-collection" aria-labelledby="emu-collection-h" hidden>
          <h2 class="rux--type-heading-03" id="emu-collection-h">Rux's Collection</h2>
          <div class="emu-cabinet" id="emu-cabinet" role="group" aria-label="Consoles"></div>
          <div class="rux--stack-vertical rux--stack-scale-3">
            <div class="emu-picked">
              <div>
                <h3 class="rux--type-heading-02" id="emu-picked"></h3>
                <p class="emu-row__sub" id="emu-picked-sub"></p>
              </div>
              <button type="button" class="rux--btn rux--btn--sm rux--layout--size-sm rux--btn--tertiary" id="emu-picked-move" hidden></button>
            </div>
            <ul class="emu-shelf" role="list" id="emu-games" aria-labelledby="emu-picked"></ul>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
<!-- Search, from the header's button: any game by its title, from search.js. -->

        </button>
      </div>
    </div>
    <div class="rux--modal-content emu-search">
      <div class="rux--search rux--layout--size-lg" role="search" aria-labelledby="emu-search-h">

        <label class="rux--label rux--visually-hidden" for="emu-search-input">Search games</label>
        <input id="emu-search-input" class="rux--search-input" type="text" role="searchbox" placeholder="Title" autocomplete="off" autofocus>
