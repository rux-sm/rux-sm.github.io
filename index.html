<!--
  RUX APPS IS HEADER-ONLY: the app
  grid from switcher.json and nothing else until cross-app data exists. The
  quiet Foundations link to the Design repository went on 2026-09-07, rux's
  call in the same pass that stripped the page: the running system is a card
  in the grid, and the source is a bookmark away. The side nav that Design's app-shell template carries
  left on 2026-09-03. It held two items, Home and an anchor to the grid on the
  same screen, so it navigated nowhere the page did not already show; the
  switcher in the header is this site's navigation, and it is the same on
  every app. With the nav went the hamburger, whose only job is to open one,
  the scrim it overlays, and the <style> block that indented .rux--content
  past a nav inside the header. With no nav, Carbon's own rule applies:
  `.rux--header ~ .rux--content` clears the header and nothing indents it.

  THE SHAPE IS CAPTURED. components-ui-shell-header--header-w-actions-and-
  right-panel renders a header with global actions, a panel and a content
  region, and no menu trigger, no side nav and no header nav -- read from
  Design data/carbon-react-dom.json, not guessed. This is not a rail or a
  collapsed nav, which Design's choices.md says to ask before offering; it is
  the absence of one.

  THE SHELL CARRIES ITS OWN THEME, and `data-theme="g100"` on the header is
  that. Carbon's UI-shell-header/style.mdx says the shell "can be customized to
  use any of the four IBM themes by applying an inline theme to the shell
  zone", and the header's background token is plain `$background` — so a shell
  left on the page's theme is white on a white page, separated from it by one
  1px border and nothing else. The shell zone is the header.
  `js/theme.js` OWNS THIS ATTRIBUTE ONCE THE PAGE RUNS, and the value here is
  what a browser with no stored preference keeps: Carbon's four leave the
  shell on g100, and a theme above those four takes the shell with the page,
  drawn on that theme's own `layer-01` so the bar still stands off it.
  Change it to `white` only if you mean the shell to disappear into the page.

  THE SPRITE IS INLINED, and has to be. Referencing it as
  `../assets/icons.svg#i-name` was tried and is broken in two ordinary cases:
  WebKit has never supported a cross-document <use>, so every icon on the page
  is blank in Safari, and opening the file over file:// blocks the fetch in
  every engine. Both fail SILENTLY — the CSS and the scripts still load, so the
  page looks built and simply has no icons in it. A file meant to be copied
  cannot carry that.

  The block after <body> is generated. `npm run icons` rewrites it in every
  template from assets/icons.svg, and check-icons fails if one drifts, so
  neither a stale copy nor a hand-edit survives.

  EVERY BEHAVIOUR MODULE LOADS, not just ui-shell, so a modal or a data table
  pasted into `main` needs no script of its own. The kernel is first because
  the others delegate to it.
-->

<header class="rux--header" data-theme="g100" aria-label="Rux Home">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>

  <!-- The logo is brand/logo.svg and brand/logo-dark.svg, the same drawing in
       gray 10 and gray 100. Swap them and every page here picks them up on
       reload: no build step, no markup edit.
       It is an img, not inline SVG: currentColor cannot reach inside one, so
       the file carries its own colour, and js/theme.js rewrites the src to
       whichever of the two reads on the bar -- #161616 under Carbon's four
       themes, and the theme's own colour above them.
       Sized by HEIGHT so the file's own aspect governs. -->
  <a class="rux--header__name" href="./"><img src="brand/logo.svg" alt="" style="height:1.5rem;width:auto;margin-right:.17rem;flex:none">
    <span class="rux--header__name--prefix">Rux</span>&nbsp;Home</a>

  <!-- REPLACE: top-level product navigation. The current one carries
       --header__menu-item--current and aria-current="page". -->

  <!-- The global action: the account, which is the person's picture once
       someone is logged in. Icon-only, so it has an aria-label. It opens the
       one panel below, which holds the theme, the way to the profile and
       out, and the apps that account can open.

       ORDER IS PRESCRIBED, right to left: switcher, account, notifications,
       help. Carbon fixes those so they do not shift as a user moves between
       products, and anything a product adds of its own goes in the band LEFT
       of them. Nothing here notifies or has help to open, and an icon-only
       button with no handler is an affordance that lies, so neither has a
       button. -->
  <div class="rux--header__global">
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="Account" aria-expanded="false" aria-controls="rux-account-panel"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#i-user--avatar"/></svg></button>

<main id="main-content" class="rux--content">
  <!-- REPLACE: everything below EXCEPT the stack. The region is Carbon's own:
       `.rux--header ~ .rux--content` clears the header, and with no side nav
       nothing indents it, so the column runs full width inside its 2rem. -->
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--col-span-100">

      <!-- KEEP THIS WRAPPER. It is the page's only vertical rhythm, and a copy
           that drops it gets none: Carbon components carry no margin, because
           the spacing overview has them "delegate the responsibility of
           positioning and layout to parent components", so every child of this
           column would measure margin 0 and gapToNext 0, flush against its
           neighbour. templates/detail-page.html records the rule.

           THE FRAME SHIPPED WITHOUT IT UNTIL 2026-08-29, and that is why this
           comment is here rather than in a doc. detail-page, empty-state and
           error-state each open their column with this exact wrapper; this
           file, the one the other five are copied from, opened with a bare h1
           and p 24px too close together.

           SCALE 6 IS THE SHELL'S DEFAULT, NOT A REQUIREMENT. It is what those
           three chose. Two files answer differently, and both were corrected
           on 2026-08-30 — this paragraph described them as they were before.

           form-page wraps its h1 AND its form in `stack-scale-7`, matching the
           32px rhythm of the stack that spaces the fields (that stack sits on
           a div inside the <form>, not on the form, which takes no class).
           Until that day the h1 was a bare child of the column and the form
           opened at its exact bottom edge, 0px — this same fault, in the last
           template still carrying it.

           table-page wraps its h1 and the data-table container, and leaves
           PAGINATION OUTSIDE the stack on purpose: a stack gaps its children
           and pagination is meant to sit flush against the table. It had no
           stack at all until it was given an h1.

           Change the scale to suit the page, and put only the children that
           should be separated inside it; do not delete the wrapper without
           knowing which of those cases you are in. -->
      <!-- ONE JOB: GO TO AN APP. Stripped 2026-09-07 to what the page is
           for. The h1 is visually hidden because the header already reads
           "Rux Home" 40px above it and naming it twice is what this pass
           removed; .rux--visually-hidden is Carbon's own, so a screen reader
           still gets a titled page. No section heading (the h1 is the only
           title), no intro (it described how the sites are built, which is
           README.md's job).

           THE TILES STAYED, and that was rux's read of the alternative: a
           list of large links on one background blends into one block, while
           a tile draws the edge that says these are separate apps.

           EVERY TILE IS BUILT IN ONE PLACE. switcher.js fills this grid from
           switcher.json, minus the page you are on: the app's icon at 32px,
           its name, and three or four words. The grid is empty here so that
           no second copy of a tile exists to differ from the first; if the
           fetch fails, the header's switcher panel keeps the entries this
           page shipped. -->
      <div class="rux--stack-vertical rux--stack-scale-7">
        <h1 class="rux--visually-hidden">Apps</h1>
        <section aria-label="Apps">
          <div class="rux--subgrid rux--subgrid--wide rux--subgrid--with-row-gap" id="apps-grid"></div>
        </section>
      </div>
    </div>
  </div>
</main>
