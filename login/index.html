<!doctype html>
<html lang="en" data-theme="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Home</title>
<script src="/funnel.js"></script>
<style>html:not([data-rux-unlocked]){visibility:hidden}</style>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/design/assets/fonts/IBMPlexSans-Regular-Latin1.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/design/assets/fonts/IBMPlexSans-SemiBold-Latin1.woff2">
<link rel="stylesheet" href="/design/assets/fonts/plex.css">
<link rel="stylesheet" href="/design/css/rux.css">
<link rel="stylesheet" href="/design/css/rux-theme.css">
<link rel="stylesheet" href="/design/css/rux-overrides.css">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../overrides.css">
<script src="/design/js/custom-themes.js"></script>
<script src="/design/js/theme.js"></script>
</head>
<body>
<!-- The site's log-in page: the same shell as ../account/index.html, with the
     header reduced to the mark, because nothing past it opens without a log-in.
     The form follows Carbon's login pattern: a title, the ID and password
     fields and one primary button. Accounts and password resets
     are made in the Supabase dashboard, so there is no "forgot password" or
     "create account". app.js logs in and sends the account on. -->

     from design/assets/icons.svg. -->

<header class="rux--header" data-theme="g100" aria-label="Rux Home">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <a class="rux--header__name" href="/"><img src="../brand/logo.svg" alt="" style="height:1.5rem;width:auto;margin-right:.5rem;flex:none">
    <span class="rux--header__name--prefix">Rux</span>&nbsp;Home</a>
</header>

<main id="main-content" class="rux--content">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--sm:col-span-4 rux--md:col-span-6 rux--lg:col-span-6">
      <form id="login-form" novalidate>
        <div class="rux--stack-vertical rux--stack-scale-6">
          <h1 class="rux--type-productive-heading-05">Log in</h1>
          <div class="rux--form-item rux--text-input-wrapper">
            <label class="rux--label" for="login-username">Username</label>
            <div class="rux--text-input__field-outer-wrapper">
              <div class="rux--text-input__field-wrapper">
                <input id="login-username" class="rux--text-input" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
              </div>
            </div>
          </div>
          <div class="rux--form-item rux--text-input-wrapper rux--password-input-wrapper">
            <label class="rux--label" for="login-password">Password</label>
            <div class="rux--text-input__field-outer-wrapper">
              <div class="rux--text-input__field-wrapper">
                <input id="login-password" class="rux--text-input rux--password-input" type="password" autocomplete="current-password">
              </div>
            </div>
          </div>
          <div id="login-captcha"></div>
          <!-- A plain wrapper carries `hidden`, because the notification's own
               display rule beats the browser's [hidden]. -->
          <div id="login-error" role="alert" hidden>
            <div class="rux--inline-notification rux--inline-notification--error">
              <div class="rux--inline-notification__details">
                <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-error--filled"/></svg>
                <div class="rux--inline-notification__text-wrapper">
                  <div class="rux--inline-notification__subtitle" id="login-error-text"></div>
                </div>
              </div>
            </div>
          </div>
          <div><button type="submit" class="rux--btn rux--btn--primary" id="login-submit">Log in</button></div>
        </div>
      </form>
    </div>
  </div>
</main>

<script src="/design/js/profile.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script src="../account.js"></script>
<script src="app.js"></script>
</body>
</html>
