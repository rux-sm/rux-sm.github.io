/* Scaffolding for the map draft (docs/plans/notes-learning-tool.md). The rules
   move into the build with the Understand view, and this page is deleted. */
body { background: var(--rux-background); color: var(--rux-text-primary); }
.notes-mapspec { max-inline-size: 90rem; margin: auto; padding: 3rem 1.25rem 6rem; }
.notes-mapspec__bar { display: flex; flex-wrap: wrap; align-items: end; gap: 1.5rem; margin-block: 1.5rem 1rem; }
.notes-mapspec__bar .rux--form-item { flex: 0 0 18rem; }
.notes-mapspec__key { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; font-size: .75rem; color: var(--rux-text-secondary); }
.notes-mapspec__key span { display: inline-flex; align-items: center; gap: .375rem; }
.notes-mapspec__key i { display: inline-block; inline-size: 1.5rem; border-block-start: 2px solid var(--rux-text-secondary); }
.notes-mapspec__key i[data-kind="feed"] { border-block-start-style: dashed; }
.notes-mapspec__key i[data-kind="branch"] { border-block-start-color: var(--rux-support-error); }
.notes-mapspec__scroll { overflow-x: auto; border: 1px solid var(--rux-border-subtle-01); }
.notes-map { position: relative; display: grid; grid-template-columns: 7rem repeat(6, minmax(11rem, 1fr)); min-inline-size: 76rem; }
.notes-map__head, .notes-map__lane { padding: .75rem; font-size: .75rem; color: var(--rux-text-secondary); background: var(--rux-layer-01); }
.notes-map__head[data-boundary] { color: var(--rux-support-error); }
.notes-map__cell { display: flex; flex-direction: column; gap: 1rem; padding: 1rem 1.25rem; border-block-start: 1px solid var(--rux-border-subtle-01); min-block-size: 5rem; }
.notes-map__lane { border-block-start: 1px solid var(--rux-border-subtle-01); }
.notes-map__tile { position: relative; z-index: 1; display: grid; gap: .25rem; padding: .375rem .5rem; border: 1px solid var(--rux-border-strong-01); background: var(--rux-background); font-size: .75rem; line-height: 1.3; }
.notes-map__tile code { font-size: .6875rem; color: var(--rux-text-secondary); }
.notes-map__tile[data-screen="no"] { border-style: dashed; }
.notes-map__tags { display: flex; flex-wrap: wrap; gap: .25rem; }
.notes-map__tags .rux--tag { margin: 0; }
.notes-map[data-lit] .notes-map__tile:not([data-lit]) { color: var(--rux-text-disabled); border-color: var(--rux-border-subtle-01); }
.notes-map[data-lit] .notes-map__tile:not([data-lit]) .rux--tag { display: none; }
.notes-map[data-lit] .notes-map__tile:not([data-lit]) code { color: inherit; }
.notes-map__tile[data-lit] { border: 2px solid var(--rux-border-interactive); }
.notes-map__lines { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; pointer-events: none; }
.notes-map__lines path { fill: none; stroke: var(--rux-text-secondary); stroke-width: 1.5; }
.notes-map__lines path[data-kind="feed"] { stroke-dasharray: 4 4; }
.notes-map__lines path[data-kind="branch"] { stroke: var(--rux-support-error); }
.notes-map__lines[data-layer="labels"] { z-index: 2; }
.notes-map__lines text { font-size: .6875rem; fill: var(--rux-support-error); text-anchor: end; paint-order: stroke; stroke: var(--rux-background); stroke-width: 4px; }
.notes-map__lines marker path { fill: var(--rux-text-secondary); stroke: none; }
.notes-map[data-lit] .notes-map__lines g:not([data-lit]), .notes-map[data-lit] .notes-map__lines text:not([data-lit]) { opacity: .2; }
.notes-map__lines g[data-lit] path { stroke: var(--rux-border-interactive); stroke-width: 2; }
.notes-mapspec h2 { margin-block: 3rem .75rem; }
.notes-mapspec td { vertical-align: top; }
</style></head><body><!-- SPRITE:BEGIN -->

<!-- SPRITE:END --><main class="notes-mapspec" id="main">
<h1 class="rux--type-productive-heading-05">Demand to shipment</h1>

<div class="notes-mapspec__bar">
  <div class="rux--form-item">
    <div class="rux--select rux--layout--size-md">
      <label class="rux--label" for="scenario">Scenario</label>
      <div class="rux--select-input__wrapper">
        <select id="scenario" class="rux--select-input">
          <option class="rux--select-option" value="">Whole map</option>
        </select>
        <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
      </div>
    </div>
  </div>
  <p class="notes-mapspec__key">
    <span><i data-kind="flow"></i>leads to</span>
    <span><i data-kind="branch"></i>branch</span>
    <span><i data-kind="feed"></i>needs first</span>
    <span>dashed box: no screen</span>
  </p>
</div>

<div class="notes-mapspec__scroll"><div class="notes-map" id="map"></div></div>

<h2 class="rux--type-productive-heading-03">Scenario routes</h2>
<div class="rux--data-table-content">
  <table class="rux--data-table rux--data-table--sm" id="routes">
  <thead><tr><th scope="col"><div class="rux--table-header-label">Scenario</div></th><th scope="col"><div class="rux--table-header-label">Tasks on the map</div></th><th scope="col"><div class="rux--table-header-label">Tasks not on the map</div></th><th scope="col"><div class="rux--table-header-label">Needs first</div></th></tr></thead>
  <tbody></tbody>
  </table>
</div>

<h2 class="rux--type-productive-heading-03">Branches</h2>
<div class="rux--data-table-content">
  <table class="rux--data-table rux--data-table--sm" id="branches">
  <thead><tr><th scope="col"><div class="rux--table-header-label">From</div></th><th scope="col"><div class="rux--table-header-label">When</div></th><th scope="col"><div class="rux--table-header-label">Goes to</div></th><th scope="col"><div class="rux--table-header-label">Setting that decides it</div></th></tr></thead>
  <tbody></tbody>
  </table>
</div>

<h2 class="rux--type-productive-heading-03">Not walked</h2>
<div class="rux--data-table-content">
  <table class="rux--data-table rux--data-table--sm" id="unwalked">
  <thead><tr><th scope="col"><div class="rux--table-header-label">Tile</div></th><th scope="col"><div class="rux--table-header-label">What it decides</div></th></tr></thead>
  <tbody></tbody>
  </table>
</div>

<div hidden>
  <div class="rux--tag rux--layout--size-sm rux--tag--gray rux--tag--sm"><span class="rux--tag__label">Step</span></div>
  <div class="rux--tag rux--layout--size-sm rux--tag--magenta rux--tag--sm"><span class="rux--tag__label">Setup</span></div>
  <div class="rux--tag rux--layout--size-sm rux--tag--purple rux--tag--sm"><span class="rux--tag__label">Decision</span></div>
  <div class="rux--tag rux--layout--size-sm rux--tag--teal rux--tag--sm"><span class="rux--tag__label">Result</span></div>
  <div class="rux--tag rux--layout--size-sm rux--tag--cyan rux--tag--sm"><span class="rux--tag__label">Lookup</span></div>
  <div class="rux--tag rux--layout--size-sm rux--tag--red rux--tag--sm"><span class="rux--tag__label">Not walked</span></div>
  <div class="rux--tag rux--layout--size-sm rux--tag--blue rux--tag--sm"><span class="rux--tag__label">Task</span></div>
</div>
</main>
<script>
// Draws atlas's exported overview as lanes and stages, with its three kinds of
// link as lines, and lists what the export does not yet say: which tasks of a
// scenario sit off the map, which setting decides a branch, and which tiles
// nobody has walked.
(async function () {
  const DATA = 'data/atlas/';
  const SCENARIOS = ['create-basic-test-items-and-defaults', 'run-order-planning-for-one-item',
    'check-item-inventory', 'purchase-order-to-warehouse-receipt',
    'manual-production-order-existing-master-data', 'transfer-item-between-warehouses',
    'ship-from-stock', 'demand-to-shipment-via-planning'];
  const get = (name) => fetch(DATA + name + '.json').then((r) => r.json());
  const overview = await get('order-to-shipment-overview');
  const scenarios = (await Promise.all(SCENARIOS.map(get))).sort((a, b) => a.order - b.order);
  const { lanes, stages, nodes, edges } = overview.diagram;
  const byId = new Map(nodes.map((n) => [n.id, n]));

  const el = (tag, attrs, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) node.setAttribute(k, v);
    node.append(...kids);
    return node;
  };
  // Whole class names, so the class check can read each one.
  const TAG = { gray: 'rux--tag--gray', magenta: 'rux--tag--magenta', purple: 'rux--tag--purple',
    teal: 'rux--tag--teal', cyan: 'rux--tag--cyan', red: 'rux--tag--red', blue: 'rux--tag--blue' };
  const tag = (colour, text) => el('div', { class: 'rux--tag rux--layout--size-sm rux--tag--sm ' + TAG[colour] },
    el('span', { class: 'rux--tag__label' }, text));

  // A tile on no leads-to or branch line is setup: it feeds the route and is not on it.
  const onRoute = new Set(edges.filter((e) => e.kind !== 'feed').flatMap((e) => [e.from, e.to]));
  const kindOf = (n) => n.kind === 'gate' || n.kind === 'decision' ? ['purple', 'Decision']
    : n.kind === 'read' ? ['cyan', 'Lookup']
    : !onRoute.has(n.id) ? ['magenta', 'Setup']
    : n.kind === 'step' || n.kind === 'transfer' ? ['gray', 'Step'] : ['teal', 'Result'];
  // The export has no field for an unwalked tile; atlas says it in the tile's own sentence.
  const unwalked = (n) => /Not documented for this release/.test(n.does.text);

  const map = document.getElementById('map');
  map.append(el('div', { class: 'notes-map__head' }));
  for (const s of stages) map.append(el('div', { class: 'notes-map__head', 'data-boundary': s.boundary ? '' : null }, `${s.n} · ${s.name}`));
  const tiles = new Map();
  for (const lane of lanes) {
    map.append(el('div', { class: 'notes-map__lane' }, lane.name));
    for (const s of stages) {
      const cell = el('div', { class: 'notes-map__cell' });
      for (const n of nodes.filter((x) => x.lane === lane.name && x.stage === s.n)) {
        const [colour, label] = kindOf(n);
        const tags = el('div', { class: 'notes-map__tags' }, tag(colour, label));
        if (unwalked(n)) tags.append(tag('red', 'Not walked'));
        const tile = el('div', { class: 'notes-map__tile', 'data-screen': n.code ? 'yes' : 'no' }, tags, el('span', {}, n.session));
        if (n.code) tile.append(el('code', {}, n.code));
        tiles.set(n.id, { tile, tags });
        cell.append(tile);
      }
      map.append(cell);
    }
  }

  const SVG = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('class', 'notes-map__lines');
  svg.setAttribute('aria-hidden', 'true');
  map.append(svg);
  // Labels sit on their own layer above the tiles, so a line can pass behind a
  // tile and its label still reads.
  const labels = document.createElementNS(SVG, 'svg');
  labels.setAttribute('class', 'notes-map__lines');
  labels.setAttribute('data-layer', 'labels');
  labels.setAttribute('aria-hidden', 'true');
  map.append(labels);

  // Every line leaves a tile's side and enters the next tile's side, with one
  // turn in the gap before the tile it reaches; two tiles in one column are
  // joined top to bottom. A branch's label sits beside the turn.
  function draw() {
    const box = map.getBoundingClientRect();
    const rect = (id) => {
      const r = tiles.get(id).tile.getBoundingClientRect();
      return { l: r.left - box.left, r: r.right - box.left, t: r.top - box.top, b: r.bottom - box.top,
        cx: r.left - box.left + r.width / 2, cy: r.top - box.top + r.height / 2 };
    };
    svg.replaceChildren();
    labels.replaceChildren();
    const defs = document.createElementNS(SVG, 'defs');
    defs.innerHTML = '<marker id="notes-map-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z"/></marker>';
    svg.append(defs);
    const lit = map.dataset.lit;
    edges.forEach((e, i) => {
      const a = rect(e.from), b = rect(e.to), off = (i % 5) * 3 - 6;
      let d, lx, ly;
      if (b.l >= a.r) { const mx = b.l - 10 + off / 2; d = `M${a.r} ${a.cy + off}H${mx}V${b.cy + off}H${b.l}`; lx = mx - 6; ly = (a.cy + b.cy) / 2 + off + 3; }
      else if (b.r <= a.l) { const mx = b.r + 10 + off / 2; d = `M${a.l} ${a.cy + off}H${mx}V${b.cy + off}H${b.r}`; lx = mx - 6; ly = (a.cy + b.cy) / 2 + off + 3; }
      else if (b.t >= a.b) { d = `M${a.cx + off * 3} ${a.b}V${b.t}`; lx = a.cx + off * 3 - 6; ly = (a.b + b.t) / 2 + 3; }
      else { d = `M${a.cx + off * 3} ${a.t}V${b.b}`; lx = a.cx + off * 3 - 6; ly = (a.t + b.b) / 2 + 3; }
      const g = document.createElementNS(SVG, 'g');
      if (lit && tiles.get(e.from).tile.hasAttribute('data-lit') && tiles.get(e.to).tile.hasAttribute('data-lit')) g.setAttribute('data-lit', '');
      const path = document.createElementNS(SVG, 'path');
      path.setAttribute('d', d);
      path.setAttribute('data-kind', e.kind);
      path.setAttribute('marker-end', 'url(#notes-map-arrow)');
      g.append(path);
      if (e.kind === 'branch' && e.label) {
        const text = document.createElementNS(SVG, 'text');
        text.setAttribute('x', lx);
        text.setAttribute('y', ly);
        text.textContent = e.label.text;
        if (g.hasAttribute('data-lit')) text.setAttribute('data-lit', '');
        labels.append(text);
      }
      svg.append(g);
    });
  }

  // A scenario lights the tiles atlas links to one of its phases.
  const phasesOn = (n, id) => (n.opens || []).filter((o) => o.walkthrough === id).flatMap((o) => o.phases);
  const select = document.getElementById('scenario');
  for (const s of scenarios) select.append(el('option', { class: 'rux--select-option', value: s.id }, s.title));
  function light() {
    const id = select.value;
    if (id) map.dataset.lit = id; else delete map.dataset.lit;
    for (const n of nodes) {
      const { tile, tags } = tiles.get(n.id);
      tags.querySelector('.rux--tag--blue')?.remove();
      const phases = id ? phasesOn(n, id) : [];
      tile.toggleAttribute('data-lit', phases.length > 0);
      if (phases.length) tags.append(tag('blue', 'Task ' + phases.join(', ')));
    }
    draw();
  }
  select.addEventListener('change', light);
  new ResizeObserver(draw).observe(map);

  const row = (table, ...cells) => document.querySelector(`#${table} tbody`).append(el('tr', {}, ...cells.map((c) => el('td', {}, c))));
  for (const s of scenarios) {
    const linked = new Set(nodes.flatMap((n) => phasesOn(n, s.id)));
    const name = (p) => `${p.n} ${p.title}`;
    const needs = s.sections.filter((x) => x.kind === 'prose' && /^> Prerequisite >/.test(x.text)).map((x) => x.text.replace(/^> Prerequisite > /, ''));
    row('routes', s.title,
      s.phases.filter((p) => linked.has(p.n)).map(name).join(' · ') || 'None',
      s.phases.filter((p) => !linked.has(p.n)).map(name).join(' · ') || 'None',
      needs.join(' ') || 'Not stated');
  }
  for (const e of edges.filter((x) => x.kind === 'branch'))
    row('branches', byId.get(e.from).session, e.label ? e.label.text : '', byId.get(e.to).session, 'Not recorded');
  for (const n of nodes.filter(unwalked)) row('unwalked', n.session, n.does.text.replace(/\s*Not documented for this release\.?/, ''));

  light();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="/account.js"></script>
</body></html>
