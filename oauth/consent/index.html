<!doctype html>
<html lang="en" data-theme="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allow access — Home</title>
<script src="/funnel.js"></script>
<style>html:not([data-rux-unlocked]){visibility:hidden}</style>
<link rel="icon" href="../../brand/favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/design/assets/fonts/IBMPlexSans-Regular-Latin1.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/design/assets/fonts/IBMPlexSans-SemiBold-Latin1.woff2">
<link rel="stylesheet" href="/design/assets/fonts/plex.css">
<link rel="stylesheet" href="/design/css/rux.css">
<link rel="stylesheet" href="/design/css/rux-theme.css">
<link rel="stylesheet" href="/design/css/rux-overrides.css">
<link rel="stylesheet" href="../../theme.css">
<link rel="stylesheet" href="../../overrides.css">
<script src="/design/js/custom-themes.js"></script>
<script src="/design/js/theme.js"></script>
</head>
<body>
<!-- The consent screen for Supabase's OAuth server: the page an app is sent
     to when it asks to use a Rux account. Supabase hosts no such screen, so
     the site serves its own, at the address set as the authorization path.
     The same shell as ../../login/index.html, header reduced to the mark,
     because the question is the whole page. funnel.js counts oauth/ as Home,
     so any account with access reaches it and a signed-out one logs in first
     and comes back with the authorization id still on the address. -->

<!-- SPRITE:BEGIN — generated, do not edit. npm run build rewrites this block
     from design/assets/icons.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- Generated by tools/build-icons.mjs from @carbon/icons. Do not edit by hand.
     Path data: Carbon Design System, Copyright IBM Corp. 2015, 2026,
     licensed under the Apache License, Version 2.0. The sprite wrapper and
     the i- symbol naming are Design. See NOTICE. -->
<symbol id="i-error--filled" viewBox="0 0 16 16"><path d="M8,1C4.1,1,1,4.1,1,8s3.1,7,7,7s7-3.1,7-7S11.9,1,8,1z M10.7,11.5L4.5,5.3l0.8-0.8l6.2,6.2L10.7,11.5z"/><path fill="none" d="M10.7,11.5L4.5,5.3l0.8-0.8l6.2,6.2L10.7,11.5z" data-icon-path="inner-path" opacity="0"/></symbol>
</svg>
<!-- SPRITE:END -->

<header class="rux--header" data-theme="g100" aria-label="Rux Home">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <a class="rux--header__name" href="/"><img src="../../brand/logo.svg" alt="" style="height:1.5rem;width:auto;margin-right:.5rem;flex:none">
    <span class="rux--header__name--prefix">Rux</span>&nbsp;Home</a>
</header>

<main id="main-content" class="rux--content">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--sm:col-span-4 rux--md:col-span-6 rux--lg:col-span-6">
      <div class="rux--stack-vertical rux--stack-scale-6">
        <h1 class="rux--type-productive-heading-05">Allow access</h1>

        <p id="consent-waiting" class="rux--type-body-long-01">Reading what is being asked for.</p>

        <!-- A plain wrapper carries `hidden`, because the stack inside it sets
             its own display, which beats the browser's [hidden]. -->
        <div id="consent-ask" hidden>
          <div class="rux--stack-vertical rux--stack-scale-6">
            <p class="rux--type-body-long-01"><strong id="consent-client">An app</strong> wants to use your Rux account.</p>
            <div class="rux--stack-vertical rux--stack-scale-3">
              <h2 class="rux--type-productive-heading-01">What it is asking for</h2>
              <ul id="consent-scopes" class="rux--list--unordered"></ul>
            </div>
            <p class="rux--type-body-long-01">Anything it does, it does as you, and it reaches only what your account reaches.</p>
            <p class="rux--type-helper-text-01" id="consent-who"></p>
            <!-- Stacked, not a row: a row of two sets each button to
                 Carbon's fixed 196px, which overflows a phone-width
                 column and scrolls the page sideways. -->
            <div class="rux--btn-set rux--btn-set--stacked">
              <button type="button" class="rux--btn rux--btn--secondary" id="consent-deny">Don&rsquo;t allow</button>
              <button type="button" class="rux--btn rux--btn--primary" id="consent-allow">Allow</button>
            </div>
          </div>
        </div>

        <div id="consent-error" role="alert" hidden>
          <div class="rux--inline-notification rux--inline-notification--error">
            <div class="rux--inline-notification__details">
              <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-error--filled"/></svg>
              <div class="rux--inline-notification__text-wrapper">
                <div class="rux--inline-notification__subtitle" id="consent-error-text"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/design/js/profile.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="/account.js"></script>
<script src="app.js"></script>
</body>
</html>
