<header class="rux--header pixels-shell" data-theme="g100" aria-label="Rux Pixels">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <button type="button" class="rux--header__action rux--header__menu-trigger rux--header__menu-toggle" aria-label="Open menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-menu"/></svg></button>
  <a class="rux--header__name" href="./"><img src="/brand/logo.svg" alt="" style="height:1.5rem;width:auto;margin-right:.5rem;flex:none"><span class="rux--header__name--prefix">Rux</span>&nbsp;Pixels</a>
  <div class="rux--header__global">
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="Account" aria-expanded="false" aria-controls="rux-account-panel"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-account_circle"/></svg></button>
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="App switcher" aria-expanded="false" aria-controls="rux-switcher-panel"><svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-grid_view"/></svg></button>
  </div>
  <div class="rux--header-panel" id="rux-switcher-panel">
    <ul class="rux--switcher" aria-label="Applications">
      <li class="rux--switcher__item"><a class="rux--switcher__item-link" href="/">Home</a></li>
      <li><hr class="rux--switcher__item--divider"></li>
      <li class="rux--switcher__item"><a class="rux--switcher__item-link" href="/pixels/" aria-current="page">Pixels</a></li>
    </ul>
  </div>
  <div class="rux--header-panel" id="rux-account-panel">
    <div class="rux--layer-two rux--stack-vertical rux--stack-scale-5">
      <div class="rux--form-item rux--text-input-wrapper">
        <div class="rux--text-input__label-wrapper">
          <label class="rux--label" for="rux-profile-name">Display name</label>
        </div>
        <div class="rux--text-input__field-outer-wrapper">
          <div class="rux--text-input__field-wrapper">
            <input id="rux-profile-name" class="rux--text-input" type="text" autocomplete="nickname" placeholder="Saved in this browser">
          </div>
        </div>
      </div>
      <div class="rux--form-item">
        <fieldset class="rux--radio-button-group rux--radio-button-group--label-right rux--radio-button-group--vertical" id="rux-profile-theme">
          <legend class="rux--label">Theme</legend>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-white" class="rux--radio-button" type="radio" name="rux-theme" value="white" checked>
            <label for="rux-theme-white" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">White</span></label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-g10" class="rux--radio-button" type="radio" name="rux-theme" value="g10">
            <label for="rux-theme-g10" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">Gray 10</span></label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-g90" class="rux--radio-button" type="radio" name="rux-theme" value="g90">
            <label for="rux-theme-g90" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">Gray 90</span></label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-g100" class="rux--radio-button" type="radio" name="rux-theme" value="g100">
            <label for="rux-theme-g100" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">Gray 100</span></label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-geist-dark" class="rux--radio-button" type="radio" name="rux-theme" value="geist-dark">
            <label for="rux-theme-geist-dark" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">Geist dark</span></label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-ant-dark" class="rux--radio-button" type="radio" name="rux-theme" value="ant-dark">
            <label for="rux-theme-ant-dark" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">Ant dark</span></label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-spotify-dark" class="rux--radio-button" type="radio" name="rux-theme" value="spotify-dark">
            <label for="rux-theme-spotify-dark" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">Spotify dark</span></label>
          </div>
        </fieldset>
      </div>
      <button type="button" class="rux--btn rux--btn--tertiary" id="rux-profile-sign-in" hidden>Sign in</button>
    </div>
  </div>
  <div class="rux--side-nav__overlay"></div>
  <nav class="rux--side-nav__navigation rux--side-nav rux--side-nav--ux rux--side-nav--hidden" aria-label="Side navigation">
    <ul class="rux--side-nav__items">
      <li class="rux--side-nav__item rux--side-nav__item--active rux--side-nav__item--large">
        <a class="rux--side-nav__link rux--side-nav__link--current" href="./" aria-current="page">
          <div class="rux--side-nav__icon"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-grid_view"/></svg></div>
          <span class="rux--side-nav__link-text">Puzzles</span>
        </a>
      </li>
      <li class="rux--side-nav__item rux--side-nav__item--large">
        <a class="rux--side-nav__link" href="make.html">
          <div class="rux--side-nav__icon"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-edit"/></svg></div>
          <span class="rux--side-nav__link-text">Make</span>
        </a>
      </li>
      <li class="rux--side-nav__item rux--side-nav__item--large">
        <a class="rux--side-nav__link" href="players.html">
          <div class="rux--side-nav__icon"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-groups"/></svg></div>
          <span class="rux--side-nav__link-text">Players</span>
        </a>
      </li>
    </ul>
  </nav>
</header>

<main id="main-content" class="rux--content pixels-main">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--col-span-100">
      <div class="pixels-page">
      <!-- A guest has no header, so this line says where they are and who they are. puzzles.js fills it. -->
      <div class="pixels-guestbar" id="pixels-guestbar" hidden>
        <span class="rux--type-productive-heading-03">Pixels</span>
        <span class="pixels-meta" id="pixels-player"></span>
      </div>
      <!-- Two tabs, shown once there is a player: the puzzles, and the leaderboard. -->
      <div class="pixels-tabs" id="pixels-tabs" hidden>
      <div class="rux--tabs">
        <button type="button" class="rux--tab--overflow-nav-button rux--tab--overflow-nav-button--previous rux--tab--overflow-nav-button--hidden" aria-hidden="true" tabindex="-1"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--left"/></svg></button>
      <div class="rux--tab--list" role="tablist" aria-label="Pixels">
        <button id="pixels-tab-puzzles" class="rux--tabs__nav-item rux--tabs__nav-link rux--tabs__nav-item--selected" role="tab" type="button" aria-selected="true" aria-controls="pixels-panel-puzzles" tabindex="0">
          <div class="rux--tabs__nav-item-label-wrapper">
            <span class="rux--tabs__nav-item-label">Puzzles</span>
          </div>
        </button>
        <div class="rux--tabs__nav-item--close--hidden">
          <button type="button" class="rux--visually-hidden" tabindex="-1" aria-label="Close tab"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
        <button id="pixels-tab-board" class="rux--tabs__nav-item rux--tabs__nav-link" role="tab" type="button" aria-selected="false" aria-controls="pixels-panel-board" tabindex="-1">
          <div class="rux--tabs__nav-item-label-wrapper">
            <span class="rux--tabs__nav-item-label">Leaderboard</span>
          </div>
        </button>
        <div class="rux--tabs__nav-item--close--hidden">
          <button type="button" class="rux--visually-hidden" tabindex="-1" aria-label="Close tab"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
      </div>
        <button type="button" class="rux--tab--overflow-nav-button rux--tab--overflow-nav-button--next rux--tab--overflow-nav-button--hidden" aria-hidden="true" tabindex="-1"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--right"/></svg></button>
      </div>
      </div>
      <div class="rux--tab-content pixels-panel" role="tabpanel" id="pixels-panel-puzzles" aria-labelledby="pixels-tab-puzzles" tabindex="0">
      <div class="rux--stack-vertical rux--stack-scale-6" id="pixels-levels">
        <h1 class="rux--visually-hidden">Puzzles</h1>
        <div id="pixels-error" hidden>
        <div class="rux--inline-notification rux--inline-notification--error" role="alert">
          <div class="rux--inline-notification__details">
            <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-error-fill"/></svg>
            <div class="rux--inline-notification__text-wrapper">
              <div class="rux--inline-notification__title"></div>
              <div class="rux--inline-notification__subtitle"></div>
            </div>
          </div>
        </div>
        </div>
        <!-- puzzles.js writes today's card and a section a level here. -->
      </div>
      </div>
      <div class="rux--tab-content pixels-panel" role="tabpanel" id="pixels-panel-board" aria-labelledby="pixels-tab-board" tabindex="0" hidden>
        <!-- puzzles.js writes the two rankings here. -->
        <div id="pixels-leader"></div>
      </div>
      </div>
    </div>
  </div>
</main>

<script src="/design/js/overlay.js"></script>
<script src="/design/js/popover.js"></script>
<script src="/design/js/menu.js"></script>
<script src="/design/js/form-controls.js"></script>
<script src="/design/js/content-switcher.js"></script>

<script src="/design/js/dismiss.js"></script>
<script src="/design/js/modal.js"></script>
<script src="/design/js/tabs.js"></script>
<script src="/design/js/profile.js"></script>
<script src="/switcher.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="/account.js"></script>
<script src="app.js"></script>
<script src="data.js"></script>
<script src="puzzles.js"></script>
</body>
