<!-- The header a wide screen has, from 66rem, on every page: the places as its links, in the bar's place, and the account
     action with its panel. Design's rux-game.css draws it there and nowhere narrower. data.js shows it once there is a player,
     and app.js marks the place the page is and writes the game's own rows into the panel. -->
<header class="rux--header game-header" data-theme="g100" aria-label="Rux Pixels" hidden>
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <a class="rux--header__name" href="./"><img src="/brand/logo.svg" alt="" style="height:1.5rem;width:auto;margin-right:.17rem;flex:none"><span class="rux--header__name--prefix">Rux</span>&nbsp;Pixels</a>
  <nav class="rux--header__nav" aria-label="Pixels">
    <ul class="rux--header__menu-bar">
      <li><a class="rux--header__menu-item" href="./"><span class="rux--text-truncate-end">Play</span></a></li>
      <li><a class="rux--header__menu-item" href="create.html"><span class="rux--text-truncate-end">Create</span></a></li>
      <li><a class="rux--header__menu-item" href="me.html"><span class="rux--text-truncate-end">Me</span></a></li>
    </ul>
  </nav>
  <div class="rux--header__global">
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="Account" aria-expanded="false" aria-controls="rux-account-panel"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#i-user--avatar"/></svg></button>
  </div>
  <!-- ACCOUNT:BEGIN — generated, do not edit. `npm run build` rewrites this
       panel in every page from design/tools/lib/shell.mjs. -->
  <div class="rux--header-panel" id="rux-account-panel">
    <ul class="rux--switcher" aria-label="Account">
      <li class="rux--switcher__item" id="rux-account-profile" hidden><a class="rux--switcher__item-link" href="/account/">Profile</a></li>
      <li>
        <div class="rux--form-item">
          <div class="rux--select rux--select--inline rux--layout--size-md">
            <label class="rux--label" for="rux-profile-theme">Theme</label>
            <div class="rux--select-input--inline__wrapper">
              <div class="rux--select-input__wrapper">
                <select id="rux-profile-theme" class="rux--select-input">
                  <option class="rux--select-option" value="white" selected>White</option>
                  <option class="rux--select-option" value="g10">Gray 10</option>
                  <option class="rux--select-option" value="g90">Gray 90</option>
                  <option class="rux--select-option" value="g100">Gray 100</option>
                  <option class="rux--select-option" value="geist-dark">Geist dark</option>
                  <option class="rux--select-option" value="ant-dark">Ant dark</option>
                  <option class="rux--select-option" value="spotify-dark">Spotify dark</option>
                  <option class="rux--select-option" value="apple-light">Apple light</option>
                  <option class="rux--select-option" value="apple-dark">Apple dark</option>
                  <option class="rux--select-option" value="rux-dark">Rux dark</option>
                  <option class="rux--select-option" value="pixel-dark">Pixel dark</option>
                </select>
                <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
              </div>
            </div>
          </div>
        </div>
      </li>
      <li class="rux--switcher__item" hidden><a class="rux--switcher__item-link" href="/login/" id="rux-profile-sign-in">Log out</a></li>
    </ul>
    <ul class="rux--switcher" aria-label="Applications">
      <li class="rux--switcher__item"><a class="rux--switcher__item-link" href="/">Home</a></li>
    </ul>
  </div>
  <!-- ACCOUNT:END -->
</header>

<main id="main-content" class="rux--content game-main">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--col-span-100">
      <div class="rux--stack-vertical rux--stack-scale-6">
        <h1 class="rux--visually-hidden" id="pixels-heading">Make a puzzle</h1>
        <!-- The saved notice floats over the page's corner, so it moves nothing. -->
        <div id="pixels-saved" class="pixels-saved" hidden>
        <div class="rux--inline-notification rux--inline-notification--success" role="status">
          <div class="rux--inline-notification__details">
            <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-check_circle-fill"/></svg>
            <div class="rux--inline-notification__text-wrapper">
              <div class="rux--inline-notification__title"></div>
            </div>
          </div>
        </div>
        </div>
        <div id="pixels-error" hidden>
        <div class="rux--inline-notification rux--inline-notification--error" role="alert">
          <div class="rux--inline-notification__details">
            <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-error-fill"/></svg>
            <div class="rux--inline-notification__text-wrapper">
              <div class="rux--inline-notification__title"></div>
              <div class="rux--inline-notification__subtitle"></div>
            </div>
          </div>
        </div>
        </div>
        <!-- The frame is the width the board's size is worked out from. -->
        <div class="pixels-frame">
        <!-- One column the width of the board, in the order of the work: the
             name and the size; a toolbar of everything that acts
             on the drawing, set on the board as Carbon's text toolbar is set on
             its text, Back and Save at its start and the drawing's keys at
             its end; then the board, its check in its corner. On a phone the
             toolbar is under the board, in two lines of keys a thumb can hit,
             each its icon over its word, with the inks open under it. The
             toolbar's keys are the maker's own; the fields are Design's. -->
        <form class="pixels-maker" id="pixels-form" novalidate>
          <div class="pixels-maker-head">
            <div class="pixels-maker-top">
              <input id="pixels-name" class="rux--text-input rux--layout--size-sm" type="text" maxlength="40" autocomplete="off" required aria-label="Name" placeholder="Name">
              <!-- Choosing a size starts a blank board of it. A saved puzzle keeps its size, so make.js locks this for one, and takes 20×20 away where the puzzle is for a player's own rift. -->
              <div class="rux--select pixels-size">
                <div class="rux--select-input__wrapper">
                  <select id="pixels-size" class="rux--select-input rux--layout--size-sm" autocomplete="off" aria-label="Size">
                    <option value="5">5×5</option>
                    <option value="10" selected>10×10</option>
                    <option value="15">15×15</option>
                    <option value="20">20×20</option>
                  </select>
                  <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
                </div>
              </div>
            </div>
          </div>
          <div class="pixels-maker-work">
            <!-- At the bar's start, the puzzle's own: Exit to Create, then Save, and Delete for a saved one; on a phone Back starts the first line and these two end it. At its end, over the squares, what acts on the drawing in four groups: what takes a move back or wipes the board, the step, the colour step's tools, and its colour, which opens the inks; Draw puts the last two out of reach. -->
            <div class="pixels-toolbar" role="toolbar" aria-label="Maker" id="pixels-toolbar">
              <div class="pixels-toolbar-group pixels-toolbar-back">
                <a class="pixels-bar-key" id="pixels-exit" href="create.html" aria-label="Exit to Create" title="Exit to Create"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-arrow_back"/></svg><span class="pixels-bar-word">Exit</span></a>
              </div>
              <div class="pixels-toolbar-group pixels-toolbar-file">
                <button type="submit" class="pixels-bar-key pixels-bar-key--go" id="pixels-save" disabled aria-label="Save" title="Save"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-save"/></svg><span class="pixels-bar-word">Save</span></button>
                <button type="button" class="pixels-bar-key pixels-bar-key--danger" id="pixels-delete" data-rux-open="pixels-delete-modal" hidden aria-label="Delete" title="Delete"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-delete"/></svg><span class="pixels-bar-word">Delete</span></button>
              </div>
              <div class="pixels-toolbar-group pixels-toolbar-history">
                <button type="button" class="pixels-bar-key" id="pixels-undo" disabled aria-label="Undo" title="Undo"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-undo"/></svg><span class="pixels-bar-word">Undo</span></button>
                <button type="button" class="pixels-bar-key" id="pixels-redo" disabled aria-label="Redo" title="Redo"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-redo"/></svg><span class="pixels-bar-word">Redo</span></button>
              </div>
              <div class="pixels-toolbar-group pixels-toolbar-clear">
                <button type="button" class="pixels-bar-key" id="pixels-clear" aria-label="Clear" title="Clear"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-restart_alt"/></svg><span class="pixels-bar-word">Clear</span></button>
              </div>
              <!-- On a phone the bar is two lines, and this is where the first ends. -->
              <span class="pixels-toolbar-break" aria-hidden="true"></span>
              <!-- The step: one key, which shows the step the board is in and changes to the other, as Space does. It holds both icons and make.js says which shows. Its word is beside it where the bar has the room. -->
              <div class="pixels-toolbar-group pixels-toolbar-step">
                <button type="button" class="pixels-bar-key" id="pixels-step" data-step="draw" aria-label="Draw" title="Draw"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-edit"/></svg><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-palette"/></svg><span class="pixels-bar-word">Draw</span></button>
              </div>
              <div class="pixels-toolbar-group pixels-toolbar-tools" role="radiogroup" aria-label="Tool" id="pixels-tool">
                <button type="button" class="pixels-bar-key" role="radio" aria-checked="true" data-tool="paint" disabled aria-label="Paintbrush" title="Paintbrush"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-brush"/></svg><span class="pixels-bar-word">Brush</span></button>
                <button type="button" class="pixels-bar-key" role="radio" aria-checked="false" data-tool="fill" disabled aria-label="Bucket" title="Bucket"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-format_color_fill"/></svg><span class="pixels-bar-word">Bucket</span></button>
                <button type="button" class="pixels-bar-key" role="radio" aria-checked="false" data-tool="erase" disabled aria-label="Eraser" title="Eraser"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-ink_eraser"/></svg><span class="pixels-bar-word">Eraser</span></button>
              </div>
            </div>
            <div class="pixels-maker-board">
              <div id="pixels-board"></div>
            </div>
            <!-- Under the board: whether the numbers solve the picture and how hard, then how much the first look decides and how much is filled. -->
            <div class="pixels-maker-line">
              <div class="pixels-maker-check" id="pixels-check" aria-live="polite"></div>
              <p class="pixels-meta pixels-maker-stats" id="pixels-stats"></p>
            </div>
            <!-- The inks, open under the board for the colour step and hidden while drawing; make.js fills them. -->
            <div class="pixels-inks" id="pixels-inks" role="radiogroup" aria-label="Colour"></div>
          </div>
        </form>
        </div>
      </div>
    </div>
  </div>
  <div class="rux--layer-one rux--modal" id="pixels-delete-modal" role="presentation">
    <div role="dialog" aria-modal="true" aria-labelledby="pixels-delete-heading" tabindex="-1" class="rux--modal-container rux--modal-container--xs">
      <div class="rux--modal-header">
        <h2 class="rux--modal-header__heading" id="pixels-delete-heading">Delete this puzzle?</h2>
        <div class="rux--modal-close-button">
          <button type="button" class="rux--modal-close" aria-label="Close" data-rux-close>
            <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-close"/></svg>
          </button>
        </div>
      </div>
      <div class="rux--modal-content"><p>Its best times go with it.</p></div>
      <div class="rux--modal-footer">
        <button type="button" class="rux--btn rux--btn--secondary" data-rux-close>Keep</button>
        <button type="button" class="rux--btn rux--btn--danger" id="pixels-delete-confirm" data-rux-close>Delete</button>
      </div>
    </div>
  </div>
  <!-- Save asks where the puzzle goes: one of its size's categories, a new one, which is then named, or a day. make.js fills the list and opens this. -->
  <div class="rux--layer-one rux--modal" id="pixels-save-modal" role="presentation">
    <form role="dialog" aria-modal="true" aria-labelledby="pixels-save-heading" tabindex="-1" class="rux--modal-container rux--modal-container--xs" id="pixels-where" novalidate>
      <div class="rux--modal-header">
        <h2 class="rux--modal-header__heading" id="pixels-save-heading">Where does it go?</h2>
        <div class="rux--modal-close-button">
          <button type="button" class="rux--modal-close" aria-label="Close" data-rux-close>
            <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-close"/></svg>
          </button>
        </div>
      </div>
      <div class="rux--modal-content">
        <div class="rux--stack-vertical rux--stack-scale-5">
          <div class="rux--form-item">
            <div class="rux--select">
              <label class="rux--label" for="pixels-level">Rift</label>
              <div class="rux--select-input__wrapper">
                <select id="pixels-level" class="rux--select-input" autocomplete="off"></select>
                <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
              </div>
            </div>
          </div>
          <div id="pixels-more-theme" hidden>
            <div class="rux--form-item rux--text-input-wrapper">
              <div class="rux--text-input__label-wrapper"><label class="rux--label" for="pixels-theme">Name of the new rift</label></div>
              <div class="rux--text-input__field-outer-wrapper">
                <div class="rux--text-input__field-wrapper"><input id="pixels-theme" class="rux--text-input" type="text" maxlength="30" autocomplete="off"></div>
              </div>
            </div>
          </div>
          <!-- What a new puzzle costs a player. make.js writes it; the owner is never shown it. -->
          <p class="pixels-meta" id="pixels-mana" hidden></p>
          <div id="pixels-more-day" hidden>
            <div class="rux--form-item rux--text-input-wrapper">
              <div class="rux--text-input__label-wrapper"><label class="rux--label" for="pixels-day">Day</label></div>
              <div class="rux--text-input__field-outer-wrapper">
                <div class="rux--text-input__field-wrapper"><input id="pixels-day" class="rux--text-input" type="date"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="rux--modal-footer">
        <button type="button" class="rux--btn rux--btn--secondary" data-rux-close>Cancel</button>
        <button type="submit" class="rux--btn rux--btn--primary" id="pixels-save-now">Save</button>
      </div>
    </form>
  </div>
  <!-- How to play. app.js fills it. -->
  <div class="rux--layer-one rux--modal" id="pixels-how" role="presentation"></div>
</main>

<script src="/design/js/profile.js"></script>

<script src="/account.js"></script>

<script src="data.js"></script>

</body>
