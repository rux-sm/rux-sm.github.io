<main id="main-content" class="rux--content pixels-main">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--col-span-100">
      <div class="rux--stack-vertical rux--stack-scale-6">
        <h1 class="rux--visually-hidden" id="pixels-heading">Make a puzzle</h1>
        <div id="pixels-error" hidden>
        <div class="rux--inline-notification rux--inline-notification--error" role="alert">
          <div class="rux--inline-notification__details">
            <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-error-fill"/></svg>
            <div class="rux--inline-notification__text-wrapper">
              <div class="rux--inline-notification__title"></div>
              <div class="rux--inline-notification__subtitle"></div>
            </div>
          </div>
        </div>
        </div>
        <div id="pixels-saved" hidden>
        <div class="rux--inline-notification rux--inline-notification--success" role="status">
          <div class="rux--inline-notification__details">
            <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-check_circle-fill"/></svg>
            <div class="rux--inline-notification__text-wrapper">
              <div class="rux--inline-notification__title"></div>
            </div>
          </div>
        </div>
        </div>
        <div class="pixels-maker">
          <div id="pixels-board"></div>
          <form class="pixels-maker-side" id="pixels-form" novalidate>
            <div id="pixels-check" aria-live="polite"></div>
            <!-- Choosing a size starts a blank board of it. make.js hides this for a saved puzzle. -->
            <div id="pixels-size-row">
              <div class="rux--content-switcher rux--content-switcher--lg rux--layout--size-lg" role="tablist" aria-label="Size" id="pixels-size">
                <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false" tabindex="-1" data-size="5"><span class="rux--content-switcher__label">5×5</span></button>
                <button type="button" class="rux--content-switcher-btn rux--content-switcher--selected" role="tab" aria-selected="true" tabindex="0" data-size="10"><span class="rux--content-switcher__label">10×10</span></button>
                <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false" tabindex="-1" data-size="15"><span class="rux--content-switcher__label">15×15</span></button>
              </div>
            </div>
            <!-- Draw the puzzle, then paint the picture it finishes as. -->
            <div class="rux--content-switcher rux--content-switcher--lg rux--layout--size-lg" role="tablist" aria-label="Step" id="pixels-step">
              <button type="button" class="rux--content-switcher-btn rux--content-switcher--selected" role="tab" aria-selected="true" tabindex="0" data-step="draw"><span class="rux--content-switcher__label">Draw</span></button>
              <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false" tabindex="-1" data-step="colour"><span class="rux--content-switcher__label">Colour</span></button>
            </div>
            <div class="pixels-inks" id="pixels-inks" role="radiogroup" aria-label="Colour" hidden>
              <button type="button" class="pixels-ink" role="radio" aria-checked="false" aria-label="Black" data-ink="0"></button>
              <button type="button" class="pixels-ink" role="radio" aria-checked="false" aria-label="White" data-ink="1"></button>
              <button type="button" class="pixels-ink" role="radio" aria-checked="true" aria-label="Red" data-ink="2"></button>
              <button type="button" class="pixels-ink" role="radio" aria-checked="false" aria-label="Orange" data-ink="3"></button>
              <button type="button" class="pixels-ink" role="radio" aria-checked="false" aria-label="Yellow" data-ink="4"></button>
              <button type="button" class="pixels-ink" role="radio" aria-checked="false" aria-label="Green" data-ink="5"></button>
              <button type="button" class="pixels-ink" role="radio" aria-checked="false" aria-label="Blue" data-ink="6"></button>
              <button type="button" class="pixels-ink" role="radio" aria-checked="false" aria-label="Brown" data-ink="7"></button>
            </div>
            <div class="rux--form-item rux--text-input-wrapper">
              <div class="rux--text-input__label-wrapper"><label class="rux--label" for="pixels-name">Name</label></div>
              <div class="rux--text-input__field-outer-wrapper">
                <div class="rux--text-input__field-wrapper"><input id="pixels-name" class="rux--text-input" type="text" maxlength="40" autocomplete="off" required></div>
              </div>
            </div>
            <!-- The category the puzzle sits in on the front page; make.js fills it with those of this size, each with how many of its nine are on, and New category. -->
            <div class="rux--form-item">
              <div class="rux--select">
                <label class="rux--label" for="pixels-level">Category</label>
                <div class="rux--select-input__wrapper">
                  <select id="pixels-level" class="rux--select-input" autocomplete="off"></select>
                  <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
                </div>
              </div>
            </div>
            <!-- The name of the category above, which is its heading on the front page. Saving a puzzle saves it. -->
            <div class="rux--form-item rux--text-input-wrapper">
              <div class="rux--text-input__label-wrapper"><label class="rux--label" for="pixels-theme">Category name</label></div>
              <div class="rux--text-input__field-outer-wrapper">
                <div class="rux--text-input__field-wrapper"><input id="pixels-theme" class="rux--text-input" type="text" maxlength="30" autocomplete="off"></div>
              </div>
            </div>
            <!-- A puzzle given a day is that day's puzzle, in no category. -->
            <div class="rux--form-item rux--text-input-wrapper">
              <div class="rux--text-input__label-wrapper"><label class="rux--label" for="pixels-day">Puzzle of the day for</label></div>
              <div class="rux--text-input__field-outer-wrapper">
                <div class="rux--text-input__field-wrapper"><input id="pixels-day" class="rux--text-input" type="date"></div>
              </div>
              <div class="rux--form__helper-text">Leave empty for a puzzle in a category.</div>
            </div>
            <div class="pixels-actions">
              <button type="submit" class="rux--btn rux--btn--primary" id="pixels-save" disabled>Save</button>
              <button type="button" class="rux--btn rux--btn--ghost" id="pixels-clear">Clear</button>
              <button type="button" class="rux--btn rux--btn--danger--ghost" id="pixels-delete" data-rux-open="pixels-delete-modal" hidden>Delete</button>
            </div>
          </form>

        </div>

      <div class="rux--modal-content"><p>Its best times go with it.</p></div>
      <div class="rux--modal-footer">

        <button type="button" class="rux--btn rux--btn--danger" id="pixels-delete-confirm" data-rux-close>Delete</button>
      </div>
    </div>
