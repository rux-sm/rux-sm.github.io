<main id="main-content" class="rux--content pixels-main">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--col-span-100">
      <div class="rux--stack-vertical rux--stack-scale-6">
        <h1 class="rux--visually-hidden" id="pixels-heading">Make a puzzle</h1>
        <!-- The saved notice floats over the page's corner, so it moves nothing. -->
        <div id="pixels-saved" class="pixels-saved" hidden>
        <div class="rux--inline-notification rux--inline-notification--success" role="status">
          <div class="rux--inline-notification__details">
            <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-check_circle-fill"/></svg>
            <div class="rux--inline-notification__text-wrapper">
              <div class="rux--inline-notification__title"></div>
            </div>
          </div>
        </div>
        </div>
        <div id="pixels-error" hidden>
        <div class="rux--inline-notification rux--inline-notification--error" role="alert">
          <div class="rux--inline-notification__details">
            <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-error-fill"/></svg>
            <div class="rux--inline-notification__text-wrapper">
              <div class="rux--inline-notification__title"></div>
              <div class="rux--inline-notification__subtitle"></div>
            </div>
          </div>
        </div>
        </div>
        <!-- The frame is the width the board's size is worked out from. -->
        <div class="pixels-frame">
        <!-- One column the width of the board, in the order of the work: what
             sets the puzzle up, the board with its check in the corner, what
             acts on the drawing, then the colour step's tools and inks. On a
             window wider than it is tall the tools and inks stand beside the
             board. The fields are Design's small size and the keys the game's
             own, all 32px. -->
        <form class="pixels-maker" id="pixels-form" novalidate>
          <div class="pixels-maker-head">
            <div class="pixels-maker-top">
              <a class="pixels-key pixels-key--row pixels-back" href="./" aria-label="Back to the puzzles"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-arrow_back"/></svg><span>Back</span></a>
              <input id="pixels-name" class="rux--text-input rux--layout--size-sm" type="text" maxlength="40" autocomplete="off" required aria-label="Name" placeholder="Name">
              <!-- Where the puzzle goes: one of this size's categories, a new one, or a day. make.js fills it. -->
              <div class="rux--select">
                <div class="rux--select-input__wrapper">
                  <select id="pixels-level" class="rux--select-input rux--layout--size-sm" autocomplete="off" aria-label="Category"></select>
                  <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
                </div>
              </div>
              <!-- Choosing a size starts a blank board of it. A saved puzzle keeps its size, so make.js locks this for one. -->
              <div class="rux--select pixels-size">
                <div class="rux--select-input__wrapper">
                  <select id="pixels-size" class="rux--select-input rux--layout--size-sm" autocomplete="off" aria-label="Size">
                    <option value="5">5×5</option>
                    <option value="10" selected>10×10</option>
                    <option value="15">15×15</option>
                  </select>
                  <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
                </div>
              </div>
            </div>
            <!-- The one thing more the Category field can ask for: a new category's name, or the day of a puzzle of the day. -->
            <div id="pixels-more-theme" hidden><input id="pixels-theme" class="rux--text-input rux--layout--size-sm" type="text" maxlength="30" autocomplete="off" aria-label="Name of the new category" placeholder="Name of the new category"></div>
            <div id="pixels-more-day" hidden><input id="pixels-day" class="rux--text-input rux--layout--size-sm" type="date" aria-label="Day of the puzzle"></div>
          </div>
          <div class="pixels-maker-board">
            <div id="pixels-board"></div>
            <!-- Over the board's empty corner: whether the numbers solve the picture, how hard, and how much is filled. -->
            <div class="pixels-maker-check" id="pixels-check" aria-live="polite"></div>
          </div>
          <div class="pixels-maker-keys">
            <div class="pixels-joined">
              <button type="button" class="pixels-key pixels-key--row" id="pixels-undo" disabled>Undo</button>
              <button type="button" class="pixels-key pixels-key--row" id="pixels-redo" disabled>Redo</button>
              <button type="button" class="pixels-key pixels-key--row" id="pixels-clear">Clear</button>
            </div>
            <!-- Draw the puzzle, then paint the picture it finishes as. -->
            <div class="pixels-tools pixels-tools--row" role="radiogroup" aria-label="Step" id="pixels-step">
              <button type="button" role="radio" aria-checked="true" data-step="draw">Draw</button>
              <button type="button" role="radio" aria-checked="false" data-step="colour">Colour</button>
            </div>
            <div class="pixels-maker-end">
              <button type="button" class="pixels-key pixels-key--row pixels-key--danger" id="pixels-delete" data-rux-open="pixels-delete-modal" aria-label="Delete" title="Delete" hidden><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-delete"/></svg></button>
              <button type="submit" class="pixels-key pixels-key--row pixels-key--go" id="pixels-save" disabled>Save</button>
            </div>
          </div>
          <!-- The colour step's tools and its inks, which make.js fills. They are dimmed while drawing, so the board never moves. -->
          <div class="pixels-paint" id="pixels-paint" inert>
            <div class="pixels-tools" role="radiogroup" aria-label="Tool" id="pixels-tool">
              <button type="button" role="radio" aria-checked="true" data-tool="paint"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-brush"/></svg>Paintbrush</button>
              <button type="button" role="radio" aria-checked="false" data-tool="fill"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-format_color_fill"/></svg>Bucket</button>
              <button type="button" role="radio" aria-checked="false" data-tool="erase"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-ink_eraser"/></svg>Eraser</button>
            </div>
            <div class="pixels-inks" id="pixels-inks" role="radiogroup" aria-label="Colour"></div>
          </div>
        </form>
        </div>
      </div>
    </div>
  </div>
  <div class="rux--layer-one rux--modal" id="pixels-delete-modal" role="presentation">
    <div role="dialog" aria-modal="true" aria-labelledby="pixels-delete-heading" tabindex="-1" class="rux--modal-container rux--modal-container--xs">
      <div class="rux--modal-header">
        <h2 class="rux--modal-header__heading" id="pixels-delete-heading">Delete this puzzle?</h2>
        <div class="rux--modal-close-button">
          <button type="button" class="rux--modal-close" aria-label="Close" data-rux-close>
            <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-close"/></svg>
          </button>
        </div>
      </div>
      <div class="rux--modal-content"><p>Its best times go with it.</p></div>
      <div class="rux--modal-footer">
        <button type="button" class="rux--btn rux--btn--secondary" data-rux-close>Keep</button>
        <button type="button" class="rux--btn rux--btn--danger" id="pixels-delete-confirm" data-rux-close>Delete</button>
      </div>
    </div>
  </div>
  <!-- How to play. app.js fills it; the menu's entry opens it. -->
  <div class="rux--layer-one rux--modal" id="pixels-how" role="presentation"></div>
</main>
