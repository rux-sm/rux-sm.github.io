<!-- The header a wide screen has, from 66rem, on every page: the places as its links, in the bar's place, and the account
     action with its panel. Design's rux-game.css draws it there and nowhere narrower. data.js shows it once there is a player,
     and app.js marks the place the page is and writes the game's own rows into the panel. -->
<header class="rux--header game-header" data-theme="g100" aria-label="Rux Pixels" hidden>
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <a class="rux--header__name" href="./"><img src="/brand/logo.svg" alt="" style="height:1.5rem;width:auto;margin-right:.17rem;flex:none"><span class="rux--header__name--prefix">Rux</span>&nbsp;Pixels</a>
  <nav class="rux--header__nav" aria-label="Pixels">
    <ul class="rux--header__menu-bar">
      <li><a class="rux--header__menu-item" href="./"><span class="rux--text-truncate-end">Play</span></a></li>
      <li><a class="rux--header__menu-item" href="create.html"><span class="rux--text-truncate-end">Create</span></a></li>
      <li><a class="rux--header__menu-item" href="me.html"><span class="rux--text-truncate-end">Me</span></a></li>
    </ul>
  </nav>
  <div class="rux--header__global">
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="Account" aria-expanded="false" aria-controls="rux-account-panel"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#i-user--avatar"/></svg></button>
  </div>
  <!-- ACCOUNT:BEGIN — generated, do not edit. `npm run build` rewrites this
       panel in every page from design/tools/lib/shell.mjs. -->
  <div class="rux--header-panel" id="rux-account-panel">
    <ul class="rux--switcher" aria-label="Account">
      <li class="rux--switcher__item" id="rux-account-profile" hidden><a class="rux--switcher__item-link" href="/account/">Profile</a></li>
      <li>
        <div class="rux--form-item">
          <div class="rux--select rux--select--inline rux--layout--size-md">
            <label class="rux--label" for="rux-profile-theme">Theme</label>
            <div class="rux--select-input--inline__wrapper">
              <div class="rux--select-input__wrapper">
                <select id="rux-profile-theme" class="rux--select-input">
                  <option class="rux--select-option" value="white" selected>White</option>
                  <option class="rux--select-option" value="g10">Gray 10</option>
                  <option class="rux--select-option" value="g90">Gray 90</option>
                  <option class="rux--select-option" value="g100">Gray 100</option>
                  <option class="rux--select-option" value="geist-dark">Geist dark</option>
                  <option class="rux--select-option" value="ant-dark">Ant dark</option>
                  <option class="rux--select-option" value="spotify-dark">Spotify dark</option>
                  <option class="rux--select-option" value="apple-light">Apple light</option>
                  <option class="rux--select-option" value="apple-dark">Apple dark</option>
                  <option class="rux--select-option" value="rux-dark">Rux dark</option>
                  <option class="rux--select-option" value="pixel-dark">Pixel dark</option>
                </select>
                <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
              </div>
            </div>
          </div>
        </div>
      </li>
      <li class="rux--switcher__item" hidden><a class="rux--switcher__item-link" href="/login/" id="rux-profile-sign-in">Log out</a></li>
    </ul>
    <ul class="rux--switcher" aria-label="Applications">
      <li class="rux--switcher__item"><a class="rux--switcher__item-link" href="/">Home</a></li>
    </ul>
  </div>
  <!-- ACCOUNT:END -->
</header>

<main id="main-content" class="rux--content game-main">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--col-span-100">
      <!-- Drawn only once play.js has built the board, so the keys are never seen where the board will be. -->
      <!-- The frame is the width the board's size is worked out from. -->
      <div class="pixels-frame">
      <div class="pixels-game is-loading" id="pixels-game">
        <div id="pixels-error" hidden>
        <div class="rux--inline-notification rux--inline-notification--error" role="alert">
          <div class="rux--inline-notification__details">
            <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-error-fill"/></svg>
            <div class="rux--inline-notification__text-wrapper">
              <div class="rux--inline-notification__title"></div>
              <div class="rux--inline-notification__subtitle"></div>
            </div>
          </div>
        </div>
        </div>
        <!-- play.js moves this into the status row, before the clock: the picture so far, with the puzzle's name for a screen reader. -->
        <div class="pixels-info" id="pixels-info" hidden>
          <h1 class="rux--visually-hidden" id="pixels-title">Puzzle</h1>
          <div class="pixels-picture pixels-thumb" id="pixels-thumb" aria-hidden="true"></div>
        </div>
        <!-- The status row: the player's hearts, then the clock at its end. With WORLD on, play.js shows the enemy's health between them, the share of its picture still to fill, and stands the character before the hearts and the enemy's shadow after the bar. -->
        <!-- In the lesson, the step to do now. play.js writes it. -->
        <p class="pixels-lesson" id="pixels-lesson" aria-live="polite" hidden></p>
        <div class="pixels-fight">
          <div class="pixels-hearts" id="pixels-hearts" role="img" aria-label="Hearts"></div>
          <div class="pixels-foe" id="pixels-foe" role="meter" aria-label="Enemy health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" hidden><div class="pixels-foe-bar"></div></div>
          <span class="pixels-clock" id="pixels-clock" role="timer" aria-label="Time">00:00</span>
        </div>
        <!-- The board waits behind Start: play.js shows it, and starts the clock, on the tap. -->
        <div class="game-stage pixels-stage">
          <div id="pixels-board"></div>
          <!-- How many squares a drag spans, which play.js shows over the square it has reached. -->
          <div class="pixels-count" id="pixels-count" aria-hidden="true" hidden></div>
          <!-- At no hearts, shown by play.js: a fairy brings them back, or the puzzle starts again. -->
          <div class="game-cover" id="pixels-fallen" hidden>
            <div class="game-cover-panel">
              <div class="pixels-fallen-words" id="pixels-fallen-words">No hearts left</div>
              <button type="button" class="rux--btn rux--btn--primary game-cover-key" id="pixels-revive">Use a fairy</button>
              <button type="button" class="rux--btn rux--btn--ghost game-cover-key" id="pixels-again">Start again</button>
            </div>
          </div>
          <!-- Paused, shown by play.js: the clock stands and the board is bare until Resume. Restart is here, away from the keys a finger is on. -->
          <div class="game-cover" id="pixels-paused" hidden>
            <div class="game-cover-panel">
              <div class="pixels-fallen-words">Paused</div>
              <button type="button" class="rux--btn rux--btn--primary game-cover-key" id="pixels-resume">Resume</button>
              <button type="button" class="rux--btn rux--btn--ghost game-cover-key" id="pixels-restart">Restart</button>
              <a class="rux--btn rux--btn--ghost game-cover-key" id="pixels-exit" href="./">Exit</a>
            </div>
          </div>
          <div class="game-cover" id="pixels-cover">
            <div class="game-cover-panel">
              <button type="button" class="rux--btn rux--btn--primary game-cover-key" id="pixels-start">Tap to start</button>
              <button type="button" class="rux--btn rux--btn--ghost game-cover-key" id="pixels-how-open" data-rux-open="pixels-how">How to play</button>
            </div>
          </div>
        </div>
        <div class="pixels-controls">
          <div class="pixels-status" id="pixels-status" aria-live="polite"></div>
          <!-- Fill and X. For the owner play.js makes the two one switch, a sword and a shield. -->
          <div class="pixels-pick" role="radiogroup" aria-label="Tool" id="pixels-tool">
            <button type="button" role="radio" aria-checked="true" aria-label="Fill" data-tool="fill"><span class="pixels-mark pixels-mark--fill" aria-hidden="true"></span></button>
            <button type="button" role="radio" aria-checked="false" aria-label="Cross out" data-tool="x"><span class="pixels-mark pixels-mark--x" aria-hidden="true"></span></button>
          </div>
          <!-- Exit and Pause first, in Design's bar along the foot, where the other pages carry their places. Restart is on the Pause cover, and Sound is a switch in Me's list. -->
          <div class="game-keys game-keys--bar">
            <a class="game-key" id="pixels-back" href="./"><svg class="pixels-key-icon" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-arrow_back"/></svg>Exit</a>
            <button type="button" class="game-key" id="pixels-pause"><svg class="pixels-key-icon" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-pause_circle-fill"/></svg>Pause</button>
            <!-- play.js draws a fairy here, and how many the player has. --><button type="button" class="game-key" id="pixels-hint"><span class="pixels-key-fairy" id="pixels-fairies"></span>Hint</button>
            <button type="button" class="game-key" id="pixels-undo" disabled><svg class="pixels-key-icon" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-undo"/></svg>Undo</button>
            <button type="button" class="game-key" id="pixels-redo" disabled><svg class="pixels-key-icon" width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-redo"/></svg>Redo</button>
          </div>
        </div>
        <!-- Shown under the finished picture, which is the board itself. play.js puts the puzzle's rift between the time and the keys, in place of the way out. -->
        <div class="game-finish pixels-solved" id="pixels-solved" hidden>
          <div>
            <h1 class="rux--type-productive-heading-04" id="pixels-solved-name"></h1>
            <span class="pixels-clock game-finish-score" id="pixels-solved-clock"></span>
            <p class="pixels-meta" id="pixels-solved-time"></p>
            <!-- The finished picture as an image, through the phone's share sheet. play.js draws it. -->
            <button type="button" class="rux--btn rux--btn--tertiary pixels-share" id="pixels-share">Share picture</button>
          </div>
          <div class="game-finish-actions">
            <a class="rux--btn rux--btn--primary" id="pixels-next" href="./">Next puzzle</a>
            <a class="rux--btn rux--btn--ghost" id="pixels-out" href="./">Play</a>
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>
  <!-- How to play. app.js fills it; the key under Start opens it. -->
  <div class="rux--layer-one rux--modal" id="pixels-how" role="presentation"></div>
</main>
