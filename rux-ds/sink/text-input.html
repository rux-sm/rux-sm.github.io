<section class="ks-sec" id="text-input">
  <h2>Text input</h2><p>default · invalid · warning · readonly · disabled</p>
  <!-- PROVENANCE: source · cds-text-input shadow DOM
       · superseded reference for light-DOM class placement (roadmap §4.1.11) -->
  <!--
    Root is `form-item text-input-wrapper` on ONE element, then __label-wrapper and
    __field-outer-wrapper — extracted from cds-text-input's shadow DOM.

    The error text is a SIBLING of .rux--text-input__field-wrapper, not a child:
    Carbon reveals it with `[data-invalid] ~ .rux--form-requirement` (css/rux.css:6442).
    .rux--form-requirement is display:none until that selector matches.
  -->
  <div class="ks-grid">
    <div class="rux--form-item rux--text-input-wrapper rux--text-input-wrapper--inline rux--text-input-wrapper--inline--invalid">
      <div class="rux--text-input__label-wrapper">
        <label class="rux--label" for="ti-9">Inline · invalid</label>
      </div>
      <div class="rux--text-input__field-outer-wrapper">
        <div class="rux--text-input__field-wrapper" data-invalid>
          <input id="ti-9" class="rux--text-input rux--text-input--invalid" type="text" value="—" data-invalid aria-invalid="true">
        </div>
        <div class="rux--form-requirement">This field is required</div>
      </div>
    </div>

    <div class="rux--form-item rux--text-input-wrapper">
      <div class="rux--text-input__label-wrapper">
        <label class="rux--label rux--label--disabled" for="ti-10">Disabled · helper text</label>
      </div>
      <div class="rux--text-input__field-outer-wrapper">
        <div class="rux--text-input__field-wrapper">
          <input id="ti-10" class="rux--text-input" type="text" value="Fixed" disabled>
        </div>
        <div class="rux--form__helper-text rux--form__helper-text--disabled">Set by your administrator</div>
      </div>
    </div>

    <div class="rux--form-item rux--text-input-wrapper">
      <div class="rux--text-input__label-wrapper">
        <label class="rux--label" for="ti-1">Label</label>
      </div>
      <div class="rux--text-input__field-outer-wrapper">
        <div class="rux--text-input__field-wrapper">
          <input id="ti-1" class="rux--text-input" type="text" placeholder="Placeholder">
        </div>
        <div class="rux--form__helper-text">Optional helper text</div>
      </div>
    </div>

    <div class="rux--form-item rux--text-input-wrapper">
      <label class="rux--label" for="ti-2">Invalid</label>
      <div class="rux--text-input__field-outer-wrapper">
        <div class="rux--text-input__field-wrapper" data-invalid>
          <svg class="rux--text-input__invalid-icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-warning--filled"/></svg>
          <input id="ti-2" class="rux--text-input rux--text-input--invalid" type="text" value="Bad value" data-invalid aria-invalid="true">
        </div>
        <div class="rux--form-requirement">Error message</div>
      </div>
    </div>

    <div class="rux--form-item rux--text-input-wrapper">
      <label class="rux--label" for="ti-3">Warning</label>
      <div class="rux--text-input__field-outer-wrapper">
        <div class="rux--text-input__field-wrapper rux--text-input__field-wrapper--warning">
          <svg class="rux--text-input__invalid-icon rux--text-input__invalid-icon--warning" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-warning--alt--filled"/></svg>
          <input id="ti-3" class="rux--text-input rux--text-input--warning" type="text" value="Careful">
        </div>
        <div class="rux--form-requirement">Warning message</div>
      </div>
    </div>

    <div class="rux--form-item rux--text-input-wrapper rux--text-input-wrapper--readonly">
      <label class="rux--label" for="ti-4">Readonly</label>
      <div class="rux--text-input__field-outer-wrapper">
        <div class="rux--text-input__field-wrapper">
          <input id="ti-4" class="rux--text-input" type="text" value="Readonly value" readonly>
        </div>
      </div>
    </div>

    <div class="rux--form-item rux--text-input-wrapper">
      <label class="rux--label rux--label--disabled" for="ti-5">Disabled</label>
      <div class="rux--text-input__field-outer-wrapper">
        <div class="rux--text-input__field-wrapper">
          <input id="ti-5" class="rux--text-input" type="text" value="Disabled" disabled>
        </div>
      </div>
    </div>
    <!-- PASSWORD INPUT · components-passwordinput--default. The visibility
         toggle is not a plain button: it is a tooltip TRIGGER, wrapped in the
         same icon-tooltip a bare icon button gets, and it carries
         `tooltip--a11y` — the class Carbon puts on a trigger whose tooltip is
         the control's only label.

         Three classes the capture emits are left off because @carbon/styles
         defines no rule for them and check-classes would reject them:
         `icon-visibility-on`, `tooltip--bottom` and `tooltip--align-end`. The
         placement comes from the popover container instead, which is where the
         compiled CSS actually reads it. -->
    <div class="rux--form-item rux--text-input-wrapper rux--password-input-wrapper">
      <label class="rux--label" for="ti-pw">Password</label>
      <div class="rux--text-input__field-outer-wrapper">
        <div class="rux--text-input__field-wrapper rux--layout--size-md">
          <input id="ti-pw" class="rux--text-input rux--password-input" type="password" value="correct-horse">
          <span class="rux--popover-container rux--popover--caret rux--popover--high-contrast rux--popover--bottom-end rux--tooltip rux--toggle-password-tooltip rux--icon-tooltip">
            <div class="rux--tooltip-trigger__wrapper">
              <button type="button" class="rux--text-input--password__visibility__toggle rux--btn rux--tooltip__trigger rux--tooltip--a11y" aria-label="Show password">
                <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-view"/></svg>
              </button>
            </div>
            <span class="rux--popover" role="tooltip" id="tt-pw">
              <span class="rux--popover-content rux--tooltip-content">Show password</span>
              <span class="rux--popover-caret"></span>
            </span>
          </span>
        </div>
        <div class="rux--form__helper-text">At least 12 characters</div>
      </div>
    </div>
    <!-- The invalid and warning states are DEMOED rather than excepted, which is
         what check-compound asks for: @carbon/styles writes
         `.password-input.text-input--invalid` and `.password-input.text-input--warning`
         as compounds, so both classes belong on one element, and a fragment that
         holds password-input and text-input--invalid on different specimens is
         reporting a split the gate is right to flag. No capture renders an
         invalid password field; the compound selector is the reference, and a
         compound says "one element" without any inference about nesting.

         NO STATE ICON ON THESE TWO, and it is measured rather than assumed.
         `text-input__invalid-icon` is `position: absolute; inset-inline-end: 16px`
         and the visibility toggle is a 40px box flush to the same edge, so the
         icon would land inside the toggle. @carbon/styles ships no rule that
         offsets one for the other — there is no `.password-input` selector
         touching the icon anywhere in the compiled CSS. The state is carried by
         the border, the form-requirement text and aria-invalid, which is what
         Carbon leaves it to here. -->
    <div class="rux--form-item rux--text-input-wrapper rux--password-input-wrapper">
      <label class="rux--label" for="ti-pw-invalid">Password · invalid</label>
      <div class="rux--text-input__field-outer-wrapper">
        <div class="rux--text-input__field-wrapper" data-invalid>
          <input id="ti-pw-invalid" class="rux--text-input rux--password-input rux--text-input--invalid" type="password" value="short" data-invalid aria-invalid="true">
          <span class="rux--popover-container rux--popover--caret rux--popover--high-contrast rux--popover--bottom-end rux--tooltip rux--toggle-password-tooltip rux--icon-tooltip">
            <div class="rux--tooltip-trigger__wrapper">
              <button type="button" class="rux--text-input--password__visibility__toggle rux--btn rux--tooltip__trigger rux--tooltip--a11y" aria-label="Show password">
                <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-view"/></svg>
              </button>
            </div>
            <span class="rux--popover" role="tooltip" id="tt-pw-invalid">
              <span class="rux--popover-content rux--tooltip-content">Show password</span>
              <span class="rux--popover-caret"></span>
            </span>
          </span>
        </div>
        <div class="rux--form-requirement">At least 12 characters</div>
      </div>
    </div>

    <div class="rux--form-item rux--text-input-wrapper rux--password-input-wrapper">
      <label class="rux--label" for="ti-pw-warn">Password · warning</label>
      <div class="rux--text-input__field-outer-wrapper">
        <div class="rux--text-input__field-wrapper">
          <input id="ti-pw-warn" class="rux--text-input rux--password-input rux--text-input--warning" type="password" value="reused-passphrase">
          <span class="rux--popover-container rux--popover--caret rux--popover--high-contrast rux--popover--bottom-end rux--tooltip rux--toggle-password-tooltip rux--icon-tooltip">
            <div class="rux--tooltip-trigger__wrapper">
              <button type="button" class="rux--text-input--password__visibility__toggle rux--btn rux--tooltip__trigger rux--tooltip--a11y" aria-label="Show password">
                <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-view"/></svg>
              </button>
            </div>
            <span class="rux--popover" role="tooltip" id="tt-pw-warn">
              <span class="rux--popover-content rux--tooltip-content">Show password</span>
              <span class="rux--popover-caret"></span>
            </span>
          </span>
        </div>
        <div class="rux--form-requirement">This password has been used before</div>
      </div>
    </div>
  </div>
</section>
