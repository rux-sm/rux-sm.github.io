name: pages

# A push to main publishes the site. The check runs first and the deploy
# happens only if it passes. A failing push stays in git and the last good
# deployment keeps serving. This file carries no rule of its own.
#
# THE PAGE LINKS /rux-ds/… ON THE SHARED ORIGIN, so the check resolves it
# against rux-ds at the tag that is live there: the newest one. Locally the
# same check reads the sibling checkout on main; a class added on main
# passes there and fails here until it is tagged -- the right failure. The
# ref column is cut before sort -V, because ls-remote prints the commit
# first and sorting whole lines orders by commit (rux-ds roadmap §8.4).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: site
      - id: tag
        run: echo "tag=$(git ls-remote --tags --refs https://github.com/rux-sm/rux-ds.git 'v*' | awk -F/ '{print $NF}' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: rux-sm/rux-ds
          ref: ${{ steps.tag.outputs.tag }}
          path: rux-ds
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tools/check.mjs
        working-directory: site
        env:
          DS: ../rux-ds

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
