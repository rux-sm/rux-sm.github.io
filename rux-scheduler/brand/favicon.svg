<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Rux">
<title>Rux</title>
<!-- The favicon's drawing, redrawn by rux on 2026-09-10 and the SAME drawing
     brand/logo.svg carries. It replaces the 2026-09-07 mark, which had 114
     cells; this one is lighter at 97, with the same head, ear and three cell
     muzzle, a shorter back and shorter legs.
     PORTED, NOT REDRAWN HERE. rux exported it on a 67 unit artboard whose
     grid step was 4.1667, so its cell edges fell a third of a unit off the
     frame and no size rendered on whole pixels. Every coordinate in that
     export was an exact multiple of the step, so the port is a division:
     each one landed on a whole cell of this 16 grid with nothing rounded
     away, and the geometry is rux's own, unchanged.
     97 filled cells, bounds x=1..15 and y=2..14: ONE CELL OF AIR left and
     right, TWO top and bottom. Measured against the masks a launcher
     actually applies, it loses NO cells to a circular mask, to an iOS
     superellipse or to the 28 of 32 safe area, the same as the mark it
     replaces.
     One path, 3 closed loops, and the winding is load bearing: the outer
     loop runs anticlockwise and the two eye counters clockwise, so under the
     default nonzero fill the eyes stay holes. Checked both ways, even odd
     and nonzero, and both count 97.
     Whole pixel sizes are exact at any multiple of 16, which is what the
     port bought and what the 67 unit export could not offer at any size.
     Not generated from the logo; tools/make-marks.mjs reads this file and
     checks it, and writes nothing here. The two files are kept identical by
     hand, and nothing enforces it.
     Self themed because a favicon gets no CSS from the page: gray-100 on
     a light tab strip, gray-10 on a dark one. -->
<style>
svg{fill:#161616}
@media (prefers-color-scheme:dark){svg{fill:#f4f4f4}}
</style>
<path d="M7 2L12 2L12 5L15 5L15 8L11 8L11 13L10 13L10 14L9 14L9 13L8 13L8 14L7 14L7 13L5 13L5 14L4 14L4 13L3 13L3 14L2 14L2 13L1 13L1 6L2 6L2 9L7 9L7 4L6 4L6 8L4 8L4 3L7 3L7 2ZM9 3L8 3L8 5L9 5L9 3ZM11 3L10 3L10 5L11 5L11 3Z"/>
</svg>
