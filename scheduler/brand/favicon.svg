<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Scheduler">
<title>Scheduler</title>
<!-- The scheduler's own mark, a bus seen from the front, drawn by rux on the
     same 16 grid as the other apps' marks. Its twelve rectangles stay as rux
     drew them, one subpath each, all wound the same way, so where two overlap
     the default nonzero fill still paints them once. Bounds x=1..15 and
     y=2..14: one cell of air left and right, two top and bottom.
     brand/icon.svg is the same drawing for the app tile.
     Self themed because a favicon gets no CSS from the page: gray-100 on a
     light tab strip, gray-10 on a dark one. -->
<style>
svg{fill:#161616}
@media (prefers-color-scheme:dark){svg{fill:#f4f4f4}}
</style>
<path d="M3 2L4 2L4 13L3 13ZM6 9L10 9L10 13L6 13ZM3 2L13 2L13 3L3 3ZM1 5L2 5L2 8L1 8ZM1 7L4 7L4 8L1 8ZM12 7L15 7L15 8L12 8ZM3 11L13 11L13 13L3 13ZM3 8L13 8L13 10L3 10ZM14 5L15 5L15 8L14 8ZM4 12L6 12L6 14L4 14ZM10 12L12 12L12 14L10 14ZM12 2L13 2L13 13L12 13Z"/>
</svg>
