<header class="rux--header" data-theme="g100" aria-label="Scheduler">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>

  <!-- The hamburger. js/ui-shell.js toggles --expanded on the nav, keeps
       aria-expanded in step and swaps the glyph to a close icon while the nav
       is open. It starts closed, as Carbon's captures do. -->
  <button type="button" class="rux--header__action rux--header__menu-trigger rux--header__menu-toggle" aria-label="Open menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-menu"/></svg></button>

  <!-- The company's whole logo, brand/logo.svg: ESCAMILLA over TOUR BUSES.
       overrides.css sets its height by the header's buttons; replace the
       file, not this markup, and the file's own aspect sets the width. -->
  <a class="rux--header__name" href="./"><img class="scheduler-logo" src="brand/logo.svg" alt="Escamilla Tour Buses"></a>

  <!-- The global action: the account, icon-only, so it has an aria-label. It
       opens the one panel below, which holds the theme, the account's rows
       and the apps that account can open. -->
  <div class="rux--header__global">
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="Account" aria-expanded="false" aria-controls="rux-account-panel"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-account_circle"/></svg></button>
  </div>
  <!-- ACCOUNT:BEGIN — generated, do not edit. `npm run build` rewrites this
       panel in every page from design/tools/lib/shell.mjs. -->
  <div class="rux--header-panel" id="rux-account-panel">
    <ul class="rux--switcher" aria-label="Account">
      <li class="rux--switcher__item" id="rux-account-profile" hidden><a class="rux--switcher__item-link" href="/account/">Profile</a></li>
      <li>
        <div class="rux--form-item">
          <div class="rux--select rux--select--inline rux--layout--size-md">
            <label class="rux--label" for="rux-profile-theme">Theme</label>
            <div class="rux--select-input--inline__wrapper">
              <div class="rux--select-input__wrapper">
                <select id="rux-profile-theme" class="rux--select-input">
                  <option class="rux--select-option" value="white" selected>White</option>
                  <option class="rux--select-option" value="g10">Gray 10</option>
                  <option class="rux--select-option" value="g90">Gray 90</option>
                  <option class="rux--select-option" value="g100">Gray 100</option>
                  <option class="rux--select-option" value="geist-dark">Geist dark</option>
                  <option class="rux--select-option" value="ant-dark">Ant dark</option>
                  <option class="rux--select-option" value="spotify-dark">Spotify dark</option>
                  <option class="rux--select-option" value="apple-light">Apple light</option>
                  <option class="rux--select-option" value="apple-dark">Apple dark</option>
                  <option class="rux--select-option" value="rux-dark">Rux dark</option>
                </select>
                <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
              </div>
            </div>
          </div>
        </div>
      </li>
      <li class="rux--switcher__item" hidden><a class="rux--switcher__item-link" href="/login/" id="rux-profile-sign-in">Log out</a></li>
    </ul>
    <ul class="rux--switcher" aria-label="Applications">
      <li class="rux--switcher__item"><a class="rux--switcher__item-link" href="/">Home</a></li>
    </ul>
  </div>
  <!-- ACCOUNT:END -->

  <!-- The scrim. Only visible below 66rem, where the nav overlays the page;
       pressing it closes the nav. -->

<main id="main-content" class="rux--content">
<!-- Every state of the scheduler's own components, drawn by the board's own
  code from invented samples: components.js hands components-data.js's trips,
  buses, drivers and Samsara answers to bar.js and road-bar.js, so a change to
  the board shows here at once. Motion, the board and the rows are the view
  menu's, changed here for this page alone; the theme is the account's, from
  the header. -->
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--col-span-100">
      <div class="scheduler-page scheduler-components">
        <h1 class="rux--type-heading-04">Components</h1>
        <p class="rux--type-body-01 scheduler-components__intro">Every state of the board's trip bar and of a bus out on its trip, drawn by the board's own code from invented trips. The theme is your account's, from the header.</p>

        <div class="scheduler-components__view" aria-label="View" role="group">
          <div class="scheduler-components__control">
            <span class="rux--label" id="scheduler-components-motion-label">Motion</span>
            <div class="rux--content-switcher rux--content-switcher--sm rux--layout--size-sm" role="tablist" id="scheduler-components-motion" aria-labelledby="scheduler-components-motion-label">
              <button type="button" class="rux--content-switcher-btn rux--content-switcher--selected" role="tab" aria-selected="true" tabindex="0" data-motion="full"><span class="rux--content-switcher__label">Full</span></button>
              <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false" tabindex="-1" data-motion="calm"><span class="rux--content-switcher__label">Calm</span></button>
              <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false" tabindex="-1" data-motion="off"><span class="rux--content-switcher__label">Off</span></button>
            </div>
          </div>
          <div class="scheduler-components__control">
            <span class="rux--label" id="scheduler-components-board-label">Board</span>
            <div class="rux--content-switcher rux--content-switcher--sm rux--layout--size-sm" role="tablist" id="scheduler-components-board" aria-labelledby="scheduler-components-board-label">
              <button type="button" class="rux--content-switcher-btn rux--content-switcher--selected" role="tab" aria-selected="true" tabindex="0" data-board="full"><span class="rux--content-switcher__label">Full</span></button>
              <button type="button" class="rux--content-switcher-btn" role="tab" aria-selected="false" tabindex="-1" data-board="compact"><span class="rux--content-switcher__label">Compact</span></button>
            </div>
          </div>
          <fieldset class="rux--checkbox-group scheduler-components__rows">
            <legend class="rux--label">Rows</legend>
            <div class="rux--form-item rux--checkbox-wrapper">
              <input id="scheduler-components-row-client" class="rux--checkbox" type="checkbox" checked>
              <label for="scheduler-components-row-client" class="rux--checkbox-label"><div class="rux--checkbox-label-text">Client</div></label>
            </div>
            <div class="rux--form-item rux--checkbox-wrapper">
              <input id="scheduler-components-row-contact" class="rux--checkbox" type="checkbox" checked>
              <label for="scheduler-components-row-contact" class="rux--checkbox-label"><div class="rux--checkbox-label-text">Contact</div></label>
            </div>
            <div class="rux--form-item rux--checkbox-wrapper">
              <input id="scheduler-components-row-time" class="rux--checkbox" type="checkbox" checked>
              <label for="scheduler-components-row-time" class="rux--checkbox-label"><div class="rux--checkbox-label-text">Times</div></label>
            </div>
            <div class="rux--form-item rux--checkbox-wrapper">
              <input id="scheduler-components-row-update" class="rux--checkbox" type="checkbox" checked>
              <label for="scheduler-components-row-update" class="rux--checkbox-label"><div class="rux--checkbox-label-text">Update</div></label>
            </div>
            <div class="rux--form-item rux--checkbox-wrapper">
              <input id="scheduler-components-row-drivers" class="rux--checkbox" type="checkbox" checked>
              <label for="scheduler-components-row-drivers" class="rux--checkbox-label"><div class="rux--checkbox-label-text">Drivers</div></label>
            </div>
          </fieldset>
        </div>

        <!-- Filled by components.js, a section to each part of the board. -->
        <div id="scheduler-components"></div>
      </div>
    </div>
  </div>
</main>
