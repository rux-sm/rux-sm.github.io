<!-- THE APP'S OWN SHELL, AND ONLY WHERE THIS PAGE STANDS ALONE. Framed in the
     board's document viewer it is the sheet and nothing else; opened in its
     own tab it is a page of this app like any other, with the same header,
     the same account and switcher panels and the same side nav. print.js
     decides which it is and takes the `hidden` off. The wrapper carries that
     attribute rather than the header, because Carbon gives .rux--header a
     display of its own and [hidden] is the weakest rule there is. -->
<div class="scheduler-print__shell" id="scheduler-print-shell" hidden>
<header class="rux--header" data-theme="g100" aria-label="Scheduler">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <button type="button" class="rux--header__action rux--header__menu-trigger rux--header__menu-toggle scheduler-menu-trigger" aria-label="Open menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-menu"/></svg></button>
  <a class="rux--header__name" href="./"><img src="brand/logo-header.png" alt="Escamilla Tour Buses" style="height:1.25rem;width:auto;flex:none"></a>
  <div class="rux--header__global">
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="Account" aria-expanded="false" aria-controls="rux-account-panel"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#m-account_circle"/></svg></button>
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="App switcher" aria-expanded="false" aria-controls="rux-switcher-panel"><svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-grid_view"/></svg></button>
  </div>
  <div class="rux--header-panel" id="rux-switcher-panel">
    <ul class="rux--switcher" aria-label="Applications">
      <li class="rux--switcher__item"><a class="rux--switcher__item-link" href="/">Home</a></li>
      <li><hr class="rux--switcher__item--divider"></li>
      <li class="rux--switcher__item"><a class="rux--switcher__item-link" href="/scheduler/" aria-current="page">Scheduler</a></li>
    </ul>
  </div>
  <div class="rux--header-panel" id="rux-account-panel">
    <div class="rux--layer-two rux--stack-vertical rux--stack-scale-5">
      <div class="rux--form-item rux--text-input-wrapper">
        <div class="rux--text-input__label-wrapper">
          <label class="rux--label" for="rux-profile-name">Display name</label>
        </div>
        <div class="rux--text-input__field-outer-wrapper">
          <div class="rux--text-input__field-wrapper">
            <input id="rux-profile-name" class="rux--text-input" type="text" autocomplete="nickname" placeholder="Saved in this browser">
          </div>
        </div>
      </div>
      <div class="rux--form-item">
        <fieldset class="rux--radio-button-group rux--radio-button-group--label-right rux--radio-button-group--vertical" id="rux-profile-theme">
          <legend class="rux--label">Theme</legend>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-white" class="rux--radio-button" type="radio" name="rux-theme" value="white" checked>
            <label for="rux-theme-white" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">White</span></label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-g10" class="rux--radio-button" type="radio" name="rux-theme" value="g10">
            <label for="rux-theme-g10" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">Gray 10</span></label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-g90" class="rux--radio-button" type="radio" name="rux-theme" value="g90">
            <label for="rux-theme-g90" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">Gray 90</span></label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-g100" class="rux--radio-button" type="radio" name="rux-theme" value="g100">
            <label for="rux-theme-g100" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">Gray 100</span></label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-geist-dark" class="rux--radio-button" type="radio" name="rux-theme" value="geist-dark">
            <label for="rux-theme-geist-dark" class="rux--radio-button__label"><span class="rux--radio-button__appearance"></span><span class="rux--radio-button__label-text">Geist dark</span></label>

<main id="main-content" class="scheduler-print">
  <!-- TWELVE OF THE SIXTEEN COLUMNS, as the Drivers page and the quote pages
       take: the title, the list and the form all start and end on the same two
       lines, and a form is not a thing to read the full width of a window. The
       grid is Carbon's own, so the inset is the one every other page has
       rather than a number written here. print.css takes it off again in the
       board's panel, where the panel is the room, and on paper. -->
  <div class="rux--css-grid scheduler-print__grid">
    <div class="rux--css-grid-column rux--sm:col-span-4 rux--md:col-span-8 rux--lg:col-start-3 rux--lg:col-span-12 scheduler-print__column">
      <!-- THE WAY BACK, and only where this page stands alone: framed in the
           board's panel the panel's own head and its close button are the way
           back, and a trail inside a frame is chrome inside chrome. It keeps
           the trip, so Forms returns to that trip's list rather than the bare
           one. print.js fills it and takes the `hidden` off. -->
      <!-- THE PAGE'S HEAD: the trail and the name, spaced by Carbon's stack
           rather than by a margin picked here, because nothing else on a page
           supplies vertical rhythm and every number chosen by hand is one more
           thing to keep in step. It takes no room at all on a framed page,
           where both of its lines are hidden. -->
      <div class="scheduler-print__head rux--stack-vertical rux--stack-scale-3">
        <nav class="scheduler-print__crumbs" id="scheduler-print-crumbs" aria-label="Breadcrumb" hidden>
          <ol class="rux--breadcrumb rux--breadcrumb--no-trailing-slash">
            <li class="rux--breadcrumb-item"><a class="rux--link" href="print.html" id="scheduler-print-crumb-up">Forms</a></li>
            <!-- The page you are on is a span and not a link: an anchor here
                 takes a tab stop and goes nowhere, which is a keyboard trap in
                 miniature. Carbon's own capture of a current item is a span
                 carrying the link class and aria-current. -->
            <li class="rux--breadcrumb-item rux--breadcrumb-item--current"><span class="rux--link" aria-current="page" id="scheduler-print-crumb-here"></span></li>
          </ol>
        </nav>
      <!-- THE FORM'S NAME, above the bar rather than in it: it names the page,
           and a page's name is not one of its actions. Framed in the panel the
           panel's own head says it and this one goes. -->
        <h1 class="rux--type-productive-heading-04 scheduler-print__bar-title" id="scheduler-print-title" hidden></h1>
      </div>

      <!-- THE BAR, and it is Carbon's table toolbar: a band the width of the
           sheet below it, the layer's own colour, with the actions flush at
           its end. That is the shape this page wanted -- chrome in a band,
           paper under it -- and Carbon writes it already for a table. Framed
           in the board's panel the panel's toolbar is the bar, and this one
           stays hidden; print.js hands it the same controls either way. -->
      <!-- THE BAR AND THE DESK ARE ONE SURFACE, so they are one box: the head
           above is spaced off it, and these two are flush against each other. -->
      <div class="scheduler-print__hub" id="scheduler-print-hub" hidden></div>

      <div class="scheduler-print__frame">
        <section class="scheduler-print__bar" id="scheduler-print-bar" role="group" aria-label="Form actions" hidden>
          <div class="scheduler-print__controls-row">
          <!-- Whatever the bar has to say, at its start and away from the
               controls, because the sheet below is holding a form. -->
            <!-- HOW MANY SHEETS IT COMES TO, at the start of the band: it is
                 the one thing about a form you want to know before pressing
                 print, and the only place it was said before was the folds
                 drawn down the paper. -->
            <span class="scheduler-print__bar-count" id="scheduler-print-count"></span>
            <span class="scheduler-print__bar-note" id="scheduler-print-note" role="status"></span>
            <div class="scheduler-print__controls" id="scheduler-print-controls"></div>
          </div>
        </section>
      <!-- THE SHEET, AND IT IS PAPER whatever theme the page around it is in:
           the envelope on its 6 by 9 in kraft, the itinerary on white Letter,
           each at the size it really is, because the preview is where anyone
           sees what will come out of the printer. print.js puts the theme
           here rather than on the page, so every --rux-* token under it
           resolves to ink on paper while the chrome around it follows the
           theme as every other page's does.

           There is no desk under it. A lighter surface behind the sheet only
           made a bigger pale rectangle in a dark app; the page shows through
           around the paper instead. -->
        <div class="scheduler-print__sheet" id="scheduler-print-sheet"></div>
      </div>
    </div>
  </div>
</main>
