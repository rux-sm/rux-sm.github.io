<!doctype html>
<html lang="en" data-theme="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forms — Scheduler</title>
<script src="/funnel.js"></script>
<style>html:not([data-rux-unlocked]){visibility:hidden}</style>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/design/assets/fonts/IBMPlexSans-Regular-Latin1.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/design/assets/fonts/IBMPlexSans-SemiBold-Latin1.woff2">
<link rel="stylesheet" href="/design/assets/fonts/plex.css">
<link rel="stylesheet" href="/design/css/rux.css">
<link rel="stylesheet" href="/design/css/rux-theme.css">
<link rel="stylesheet" href="/design/css/rux-overrides.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="overrides.css">
<link rel="stylesheet" href="print.css">
</head>
<body>
<!-- THE FORMS THIS APP FILLS IN, one page for all of them: with no ?form= a
     list of them, with one the form itself, drawn from the subject its
     address names. print.js holds the registry and draws each one.

     IT CARRIES NO THEME SCRIPT, and data-theme="white" above is the whole
     reason: paper is white whatever theme the person keeps, and every
     --rux-* token then already resolves to ink on paper. It is the one page
     here that does not follow the person's theme.

     IT HAS NO SHELL. The viewer panel frames it beside the board, where a
     header and a nav would be chrome inside chrome; opened in its own tab it
     is a sheet of paper on a desk, which wants nothing around it either. Its
     own toolbar travels with it into both. -->

<!-- SPRITE:BEGIN — generated, do not edit. npm run build rewrites this block
     from design/assets/icons.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- Generated by tools/build-icons.mjs. Do not edit by hand.
     i- path data: Carbon Design System, Copyright IBM Corp. 2015, 2026.
     m- path data: Material Symbols, Copyright Google LLC.
     Both licensed under the Apache License, Version 2.0. r- is drawn here.
     The sprite wrapper and the symbol naming are Design. See NOTICE. -->
<symbol id="i-chevron--down" viewBox="0 0 16 16"><path d="M8 11 3 6 3.7 5.3 8 9.6 12.3 5.3 13 6z"/></symbol>
</svg>
<!-- SPRITE:END -->

<!-- THE SHELL, AND ONLY WHEN THIS PAGE STANDS ALONE. Framed in the board's
     document viewer it is the sheet and nothing else, because a header there
     would be chrome inside chrome; opened in its own tab it needs a way back,
     which is the logo. print.js decides which it is and takes the `hidden`
     off. The wrapper carries that attribute rather than the header, because
     Carbon gives .rux--header a display of its own and [hidden] is the
     weakest rule there is. -->
<div class="scheduler-print__shell" id="scheduler-print-shell" hidden>
  <header class="rux--header" data-theme="g100" aria-label="Scheduler">
    <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
    <a class="rux--header__name" href="./"><img src="brand/logo.png" alt="Escamilla Tour Buses" style="height:1.5rem;width:auto;flex:none"></a>
  </header>
</div>

<main id="main-content" class="scheduler-print">
  <div class="scheduler-print__bar" id="scheduler-print-bar" hidden>
    <span class="scheduler-print__bar-title" id="scheduler-print-title"></span>
    <div class="scheduler-print__controls" id="scheduler-print-controls"></div>
    <!-- Whatever the toolbar has to say, beside the controls rather than on
         the sheet, because the sheet is holding a form. -->
    <span class="scheduler-print__bar-note" id="scheduler-print-note" role="status"></span>
  </div>
  <div class="scheduler-print__hub" id="scheduler-print-hub" hidden></div>
  <div class="scheduler-print__sheet" id="scheduler-print-sheet"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="/account.js"></script>
<script src="print.js"></script>
</body>
</html>
