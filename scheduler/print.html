<main id="main-content" class="scheduler-print">
  <!-- TWELVE OF THE SIXTEEN COLUMNS, as the Drivers page and the quote pages
       take: the title, the list and the form all start and end on the same two
       lines, and a form is not a thing to read the full width of a window. The
       grid is Carbon's own, so the inset is the one every other page has
       rather than a number written here. print.css takes it off again in the
       board's panel, where the panel is the room, and on paper. -->
  <div class="rux--css-grid scheduler-print__grid">
    <div class="rux--css-grid-column rux--sm:col-span-4 rux--md:col-span-8 rux--lg:col-start-3 rux--lg:col-span-12 scheduler-print__column">
      <div class="scheduler-print__bar" id="scheduler-print-bar" hidden>
        <h1 class="rux--type-productive-heading-04 scheduler-print__bar-title" id="scheduler-print-title"></h1>
        <div class="scheduler-print__controls" id="scheduler-print-controls"></div>
        <!-- Whatever the toolbar has to say, beside the controls rather than on
             the sheet, because the sheet is holding a form. -->
        <span class="scheduler-print__bar-note" id="scheduler-print-note" role="status"></span>
      </div>
      <div class="scheduler-print__hub" id="scheduler-print-hub" hidden></div>
      <!-- WHERE THE FORM IS DRAWN, and how depends on the stock it names.

           The envelope names its own: 6 by 9, in kraft, and the preview is
           that envelope, because what comes out of the printer lands on it and
           this is where anyone sees whether it fits. The sheet carries g10
           with it, so the ink on that stock is the ink that prints; it says
           g10 and not white because white is Carbon's default rather than a
           theme it writes a rule for, and `data-theme="white"` matches nothing.

           A form printed on whatever is in the tray has no stock to show, so it
           is a page of this app in the theme the person keeps: a long sheet of
           white standing in a dark app reads as the app having broken rather
           than as paper.

           There is no desk under either. @media print pins g10's ink and
           whitens the stock, because the kraft is already in the tray.
           print.js sets `data-paper` and the theme from the form's entry. -->
      <div class="scheduler-print__sheet" id="scheduler-print-sheet"></div>
    </div>
  </div>
</main>
