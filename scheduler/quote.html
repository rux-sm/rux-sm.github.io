<main id="main-content" class="rux--content scheduler-quote-page">
  <div class="rux--css-grid">
    <!-- Centred in twelve of the sixteen columns at lg; app.css says why. -->
    <div class="rux--css-grid-column rux--sm:col-span-4 rux--md:col-span-8 rux--lg:col-start-3 rux--lg:col-span-12">
      <div class="rux--stack-vertical rux--stack-scale-7">
        <div class="scheduler-quote-title">
          <h1 class="rux--type-productive-heading-04">Quote calculator</h1>
          <!-- The page's two actions. Clear quote sits outside the form, so its
               form attribute ties it to the form it resets. -->
          <div class="scheduler-quote-title__actions">
            <button type="reset" form="scheduler-quote-form" class="rux--btn rux--btn--ghost rux--btn--sm rux--layout--size-sm" id="scheduler-quote-clear">Clear quote</button>
            <a class="rux--btn rux--btn--ghost rux--btn--sm rux--layout--size-sm" href="quote-rates.html">Edit rates<svg class="rux--btn__icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-edit"/></svg></a>
          </div>
        </div>

        <!-- One notice for the whole page: an account not set up as staff, a
             local preview, or rates
             that would not load. A plain wrapper carries `hidden`, because the
             notification's own display rule beats the browser's. -->
        <div id="scheduler-quote-notice" hidden>
          <div class="rux--inline-notification rux--inline-notification--info" role="status">
            <div class="rux--inline-notification__details">
              <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-information--filled"/></svg>
              <div class="rux--inline-notification__text-wrapper">
                <div class="rux--inline-notification__subtitle"><span id="scheduler-quote-notice-text"></span></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Three tiles, in the order a quote is made: the miles, the
             modifiers, and the quote they add up to. Adding days grows only
             the miles tile, so nothing else moves. A tile paints layer, so
             the fields inside it step up to layer-two. -->
        <form class="scheduler-quote" id="scheduler-quote-form" novalidate hidden>

          <!-- Most quotes are only miles and days, at the default rate with one
               driver, so the miles come first.
               quote.js draws a field a day, and Enter in the last day adds the
               next. -->
          <div class="rux--tile scheduler-quote__miles">
            <div class="rux--layer-two rux--stack-vertical rux--stack-scale-5 scheduler-quote__body">
              <fieldset class="scheduler-quote__group">
                <legend class="rux--type-heading-compact-02">Miles</legend>
                <div class="scheduler-quote-days" id="scheduler-quote-day-rows"></div>
              </fieldset>
              <div class="scheduler-quote__day-buttons">
                <button type="button" class="rux--btn rux--btn--ghost rux--btn--sm rux--layout--size-sm" id="scheduler-quote-add-day">Add day<svg class="rux--btn__icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-add"/></svg></button>
                <button type="button" class="rux--btn rux--btn--ghost rux--btn--sm rux--layout--size-sm" id="scheduler-quote-remove-day" hidden>Remove day<svg class="rux--btn__icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-subtract"/></svg></button>
              </div>
            </div>
          </div>

          <!-- The modifiers change a quote less often, in the order they are
               used. The regular quote includes one driver; a second adds its
               own pay. Dead miles and other charges count as 0 while empty. -->
          <div class="rux--tile scheduler-quote__modifiers">
            <div class="rux--layer-two scheduler-quote__body">
              <fieldset class="scheduler-quote__group">
                <legend class="rux--type-heading-compact-02">Modifiers</legend>
                <div class="rux--stack-vertical rux--stack-scale-6">
                  <div class="rux--form-item">
                    <div class="rux--select">
                      <label class="rux--label" for="scheduler-quote-rate">Mileage rate</label>
                      <div class="rux--select-input__wrapper">
                        <select id="scheduler-quote-rate" class="rux--select-input"></select>
                        <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
                      </div>
                    </div>
                  </div>
                  <div class="rux--form-item">
                    <div class="rux--select">
                      <label class="rux--label" for="scheduler-quote-drivers">Drivers</label>
                      <div class="rux--select-input__wrapper">
                        <select id="scheduler-quote-drivers" class="rux--select-input">
                          <option class="rux--select-option" value="1">1 driver</option>
                          <option class="rux--select-option" value="2">2 drivers</option>
                        </select>
                        <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
                      </div>
                    </div>
                  </div>
                  <!-- Dead miles are part of the trip's miles. quote.js puts this
                       field in Carbon's warning state while there are more of
                       them than the trip has. -->
                  <div class="rux--form-item rux--text-input-wrapper">
                    <div class="rux--text-input__label-wrapper"><label class="rux--label" for="scheduler-quote-dead">Dead miles</label></div>
                    <div class="rux--text-input__field-outer-wrapper">
                      <div class="rux--text-input__field-wrapper" id="scheduler-quote-dead-wrapper">
                        <svg class="rux--text-input__invalid-icon rux--text-input__invalid-icon--warning" id="scheduler-quote-dead-icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" hidden><use href="#i-warning--alt--filled"/></svg>
                        <input id="scheduler-quote-dead" class="rux--text-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-describedby="scheduler-quote-dead-warning">
                      </div>
                      <div class="rux--form-requirement" id="scheduler-quote-dead-warning"></div>
                    </div>
                  </div>
                  <div class="rux--form-item rux--text-input-wrapper">
                    <div class="rux--text-input__label-wrapper"><label class="rux--label" for="scheduler-quote-other">Other charges ($)</label></div>
                    <div class="rux--text-input__field-outer-wrapper">
                      <div class="rux--text-input__field-wrapper">
                        <input id="scheduler-quote-other" class="rux--text-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">
                      </div>
                    </div>
                  </div>
                </div>
              </fieldset>
            </div>
          </div>

          <!-- The quote: the miles and days it counts, then a line for each part
               of the price and the total they add up to. The second driver and
               other charges show only when the quote has them. -->
          <section class="rux--tile scheduler-quote__quote" aria-labelledby="scheduler-quote-heading">
            <div class="rux--stack-vertical rux--stack-scale-5 scheduler-quote__body">
              <h2 class="rux--type-heading-compact-02" id="scheduler-quote-heading">Quote</h2>
              <!-- Each row is a field's height, a 16px label line over a 40px
                   value line, and rows are 24px apart as the fields are, so
                   the quote's rows line up with the days and modifiers beside
                   it. A row's note sits at the end of its label line. -->
              <dl class="scheduler-quote-rows">
                <div class="scheduler-quote-row">
                  <dt class="scheduler-quote-row__label">Miles</dt>
                  <dd class="rux--type-heading-03 scheduler-quote-row__value" id="scheduler-quote-miles-out">0</dd>
                </div>
                <div class="scheduler-quote-row">
                  <dt class="scheduler-quote-row__label">Days</dt>
                  <dd class="rux--type-heading-03 scheduler-quote-row__value" id="scheduler-quote-days-out">0</dd>
                </div>
                <div class="scheduler-quote-row scheduler-quote-row--ruled">
                  <dt class="scheduler-quote-row__label">Mileage</dt>
                  <dd class="scheduler-quote-row__note" id="scheduler-quote-mileage-note"></dd>
                  <dd class="rux--type-heading-03 scheduler-quote-row__value" id="scheduler-quote-mileage">—</dd>
                </div>
                <div class="scheduler-quote-row" id="scheduler-quote-driver-line" hidden>
                  <dt class="scheduler-quote-row__label">2nd driver</dt>
                  <dd class="scheduler-quote-row__note" id="scheduler-quote-driver-note"></dd>
                  <dd class="rux--type-heading-03 scheduler-quote-row__value" id="scheduler-quote-driver">—</dd>
                </div>
                <!-- The spreadsheet's meal allowance: shown for reference and
                     added to nothing, so its figure is in the quieter colour. -->
                <div class="scheduler-quote-row" id="scheduler-quote-meals-line" hidden>
                  <dt class="scheduler-quote-row__label">Driver meals</dt>
                  <dd class="scheduler-quote-row__note">Not in total</dd>
                  <dd class="rux--type-heading-03 scheduler-quote-row__value scheduler-quote-row__value--reference" id="scheduler-quote-meals">—</dd>
                </div>
                <div class="scheduler-quote-row" id="scheduler-quote-other-line" hidden>
                  <dt class="scheduler-quote-row__label">Other charges</dt>
                  <dd class="rux--type-heading-03 scheduler-quote-row__value" id="scheduler-quote-other-out">$0.00</dd>
                </div>
                <!-- The total comes straight after the rows, not at the tile's
                     foot: the tiles share the tallest's height, and a foot
                     would drop the total out of view on a long trip. -->
                <div class="scheduler-quote-row scheduler-quote-row--ruled scheduler-quote__total" aria-live="polite">
                  <dt class="scheduler-quote-row__label">Total</dt>
                  <dd class="scheduler-quote-row__value scheduler-quote-total__value scheduler-quote__total-value" id="scheduler-quote-total">$0.00</dd>
                </div>
              </dl>
            </div>
          </section>

          <!-- Below lg the quote's total is this bar, pinned to the bottom of
               the screen until the page reaches the quote, where it lands as
               the quote's last row, in the rows' shape: a label line over the
               figure. -->
          <div class="scheduler-quote-bar" aria-live="polite">
            <span class="scheduler-quote-row__label">Total</span>
            <span class="rux--type-productive-heading-05 scheduler-quote-row__value scheduler-quote-total__value" id="scheduler-quote-bar-total">$0.00</span>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<script src="/design/js/overlay.js"></script>

<script src="/design/js/ui-shell.js"></script>
<script src="/design/js/profile.js"></script>
<script src="/switcher.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="/account.js"></script>
<script src="quote.js"></script>
</body>
