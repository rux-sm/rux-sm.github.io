<header class="rux--header" data-theme="g100" aria-label="Scheduler">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <!-- No address: someone who arrives by this link has nowhere in the app to
       go, so the logo is not a link. An <a> without href keeps Carbon's
       a.rux--header__name layout and is neither clickable nor a tab stop. -->
  <a class="rux--header__name"><img src="../brand/logo.png" alt="Escamilla Tour Buses" style="height:1.5rem;width:auto;flex:none"></a>
</header>

<main id="main-content" class="rux--content scheduler-share-page">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--sm:col-span-4 rux--md:col-span-8 rux--lg:col-start-5 rux--lg:col-span-8">
      <div class="rux--stack-vertical rux--stack-scale-6">
        <!-- Who the page is for and how many trips wait for an answer, filled in by driver.js. -->
        <!-- A plain wrapper carries `hidden`, because the stack's display
             rule beats the browser's. -->
        <div id="scheduler-leg-intro" hidden>
        <div class="rux--stack-vertical rux--stack-scale-2">
          <h1 class="rux--type-productive-heading-04" id="scheduler-leg-hello"></h1>
          <p class="rux--type-body-01" id="scheduler-leg-summary"></p>
        </div>
        </div>
        <!-- One notice for the page: no link, a link no longer active, a
             schedule that will not load, no current trips, or a local
             preview, with Try again where trying again can help. A plain
             wrapper carries `hidden`, because the notification's own display
             rule beats the browser's. -->
        <div id="scheduler-share-notice" hidden>
          <div class="rux--inline-notification rux--inline-notification--info" id="scheduler-share-notice-box" role="status">
            <div class="rux--inline-notification__details">
              <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use id="scheduler-share-notice-icon" href="#m-info-fill"/></svg>
              <div class="rux--inline-notification__text-wrapper">
                <div class="rux--inline-notification__title" id="scheduler-share-notice-title"></div>
                <div class="rux--inline-notification__subtitle" id="scheduler-share-notice-text"></div>
              </div>
            </div>
            <button type="button" class="rux--btn rux--btn--ghost rux--btn--sm rux--layout--size-sm rux--inline-notification__action-button" id="scheduler-share-retry" hidden>Try again</button>
          </div>
        </div>
        <!-- A card per trip leg, soonest first, drawn by driver.js. -->
        <div class="scheduler-leg-list" id="scheduler-leg-list"></div>
      </div>
    </div>
  </div>
</main>

<div class="rux--visually-hidden" id="scheduler-leg-announcer" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Declining is confirmed first, because dispatch is told at once. -->
<div class="rux--layer-one rux--modal" id="scheduler-leg-decline-modal" role="presentation">
  <div role="dialog" aria-modal="true" aria-labelledby="scheduler-leg-decline-h" tabindex="-1" class="rux--modal-container rux--modal-container--sm">
    <div class="rux--modal-header">
      <h2 class="rux--modal-header__heading" id="scheduler-leg-decline-h">Decline this assignment?</h2>
      <div class="rux--modal-close-button">
        <button type="button" class="rux--modal-close" aria-label="Keep the assignment" data-rux-close>
          <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-close"/></svg>
        </button>
      </div>
    </div>
    <div class="rux--modal-content">
      <p>Dispatch will be told that you can't take this trip.</p>
    </div>
    <div class="rux--modal-footer">
      <button type="button" class="rux--btn rux--btn--secondary" data-rux-close>Cancel</button>
      <button type="button" class="rux--btn rux--btn--danger" id="scheduler-leg-decline-confirm">Decline assignment</button>
    </div>
  </div>
</div>
