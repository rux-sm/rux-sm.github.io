<header class="rux--header" data-theme="g100" aria-label="Scheduler">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <!-- No address, as on the schedule link: the way back is below. -->

</header>

<main id="main-content" class="rux--content scheduler-share-page">
  <div class="rux--stack-vertical rux--stack-scale-5">
    <div class="scheduler-sheet-head">
      <a class="rux--btn rux--btn--ghost rux--btn--md rux--layout--size-md" id="scheduler-sheet-back"><svg class="rux--btn__icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-arrow_back"/></svg>Your schedule</a>
      <h1 class="rux--type-productive-heading-03" id="scheduler-sheet-title">Envelope</h1>
    </div>
    <!-- A link that will not load, or a sheet that is not the driver's. A
         plain wrapper carries `hidden`, because the notification's own
         display rule beats the browser's. -->
    <div id="scheduler-sheet-notice" hidden>
      <div class="rux--inline-notification rux--inline-notification--error" role="status">
        <div class="rux--inline-notification__details">
          <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-error-fill"/></svg>
          <div class="rux--inline-notification__text-wrapper">
            <div class="rux--inline-notification__title" id="scheduler-sheet-notice-title"></div>
            <div class="rux--inline-notification__subtitle" id="scheduler-sheet-notice-text"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- The paper, at its own size and taken down whole to the phone's width. -->
    <div class="scheduler-sheet" id="scheduler-sheet"></div>
  </div>
</main>
