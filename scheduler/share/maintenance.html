<html lang="en" data-theme="g90">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="/funnel.js"></script>
<style>html:not([data-rux-unlocked]){visibility:hidden}</style>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/design/assets/fonts/IBMPlexSans-Regular-Latin1.woff2">

<script src="/design/js/custom-themes.js"></script>

<body>
<!-- The maintenance link, which opens without a log-in: two weeks of which
     bus is out on which days, from this week's Monday, and the recent changes
     to those trips. maintenance.js reads both through the link's token and
     redraws when the database signals a change. The grid and the bars are the
     schedule's own, from app.css, read-only and two rows tall: where the trip
     goes, then when the bus leaves the yard and comes back. -->

<header class="rux--header" data-theme="g100" aria-label="Scheduler">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <!-- No address: someone who arrives by this link has nowhere in the app to
       go, so the logo is not a link. An <a> without href keeps Carbon's
       a.rux--header__name layout and is neither clickable nor a tab stop. -->
  <a class="rux--header__name"><img src="../brand/logo.png" alt="Escamilla Tour Buses" style="height:1.5rem;width:auto;flex:none"></a>
</header>

<main id="main-content" class="rux--content scheduler-share-page">
  <div class="rux--css-grid rux--css-grid--full-width">
    <div class="rux--css-grid-column rux--col-span-100">
      <div class="rux--stack-vertical rux--stack-scale-6">

        <div class="rux--stack-vertical rux--stack-scale-2">
          <h1 class="rux--type-productive-heading-04">Maintenance schedule</h1>
          <p class="rux--type-body-01" id="scheduler-share-range">Loading the schedule…</p>
        </div>

        <!-- One notice for the page: no link, a link no longer active, a
             schedule that will not load or refresh, or a local preview. A plain
             wrapper carries `hidden`, because the notification's own display
             rule beats the browser's. -->
        <div id="scheduler-share-notice" hidden>
          <div class="rux--inline-notification rux--inline-notification--info" id="scheduler-share-notice-box" role="status">
            <div class="rux--inline-notification__details">
              <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use id="scheduler-share-notice-icon" href="#i-information--filled"/></svg>
              <div class="rux--inline-notification__text-wrapper">
                <div class="rux--inline-notification__title" id="scheduler-share-notice-title"></div>
                <div class="rux--inline-notification__subtitle" id="scheduler-share-notice-text"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Fourteen day columns and two bar rows, set here because the grid's
             defaults are the schedule's seven days and six rows. -->
        <div class="scheduler-week scheduler-week--static" id="scheduler-week" role="region" aria-label="Buses over two weeks" style="--scheduler-days:14;--scheduler-bar-rows:2" hidden>
          <div class="scheduler-grid" id="scheduler-grid"></div>
        </div>

        <!-- A div, not a section, because Carbon's reset gives section
             display: block, which beats the browser's [hidden]. -->
        <div class="rux--stack-vertical rux--stack-scale-4" id="scheduler-share-changes" role="region" aria-labelledby="scheduler-share-changes-title" hidden>
          <h2 class="rux--type-productive-heading-03" id="scheduler-share-changes-title">Recent changes</h2>
          <div class="scheduler-share-scroll" id="scheduler-share-changes-list">
            <div class="rux--structured-list rux--structured-list--condensed" role="table" aria-labelledby="scheduler-share-changes-title">
              <div class="rux--structured-list-thead" role="rowgroup">
                <div class="rux--structured-list-row rux--structured-list-row--header-row" role="row">
                  <span class="rux--structured-list-th" role="columnheader">When</span>
                  <span class="rux--structured-list-th" role="columnheader">Bus</span>
                  <span class="rux--structured-list-th" role="columnheader">Change</span>
                  <span class="rux--structured-list-th" role="columnheader">Trip dates</span>
                  <span class="rux--structured-list-th" role="columnheader">Trip</span>
                  <span class="rux--structured-list-th" role="columnheader">Who</span>
                </div>
              </div>
              <div class="rux--structured-list-tbody" role="rowgroup" id="scheduler-share-changes-rows"></div>
            </div>
          </div>
          <p class="rux--type-body-01" id="scheduler-share-changes-empty" hidden></p>
        </div>

      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="/account.js"></script>
<script src="maintenance.js"></script>
</body>
</html>
