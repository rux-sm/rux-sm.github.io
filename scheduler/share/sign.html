<body>
<!-- One form a driver fills in and signs, opened from My documents on
     their schedule link. sign.js draws it from the form's fields, read
     through the link's token, and sends the answers and the drawn signature
     to the driver-form Edge Function, which files the signed PDF. -->

<header class="rux--header" data-theme="g100" aria-label="Scheduler">
  <a class="rux--skip-to-content" href="#main-content" id="scheduler-sign-skip">Skip to main content</a>
  <!-- No address, as on the schedule link: the way back is below. -->
  <a class="rux--header__name"><img src="../brand/logo.png" alt="Escamilla Tour Buses" style="height:1.5rem;width:auto;flex:none"></a>
</header>

<main id="main-content" class="rux--content scheduler-share-page">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--sm:col-span-4 rux--md:col-span-8 rux--lg:col-start-5 rux--lg:col-span-8">
      <div class="rux--stack-vertical rux--stack-scale-6">
        <div><a class="rux--btn rux--btn--ghost rux--btn--sm rux--layout--size-sm" id="scheduler-sign-back"><span id="scheduler-sign-back-text">Back to your schedule</span>
          <svg class="rux--btn__icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-arrow_back"/></svg></a></div>

        <!-- A link that will not load, or a form no longer waiting. A plain
             wrapper carries `hidden`, because the notification's own display
             rule beats the browser's. -->
        <div id="scheduler-sign-notice" hidden>
          <div class="rux--inline-notification rux--inline-notification--info" role="status" id="scheduler-sign-notice-box">
            <div class="rux--inline-notification__details">
              <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-info-fill"/></svg>
              <div class="rux--inline-notification__text-wrapper">
                <div class="rux--inline-notification__title" id="scheduler-sign-notice-title"></div>
                <div class="rux--inline-notification__subtitle" id="scheduler-sign-notice-text"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- The form, drawn by sign.js from its fields. -->
        <form class="rux--stack-vertical rux--stack-scale-6" id="scheduler-sign-form" novalidate hidden></form>

        <!-- Signed. -->
        <div id="scheduler-sign-done" hidden>
          <div class="rux--stack-vertical rux--stack-scale-6">
            <div class="rux--inline-notification rux--inline-notification--success" role="status">
              <div class="rux--inline-notification__details">
                <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-check_circle-fill"/></svg>
                <div class="rux--inline-notification__text-wrapper">
                  <div class="rux--inline-notification__title" id="scheduler-sign-done-title"></div>
                  <div class="rux--inline-notification__subtitle" id="scheduler-sign-done-text"></div>
                </div>
              </div>
            </div>
            <a class="rux--btn rux--btn--primary rux--layout--size-lg scheduler-sign-submit" id="scheduler-sign-done-back"><span id="scheduler-sign-done-back-text">Back to your schedule</span>
              <svg class="rux--btn__icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-arrow_back"/></svg></a>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/design/js/overlay.js"></script>

</html>
