<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow your bus — Scheduler</title>
<script src="/funnel.js"></script>
<style>html:not([data-rux-unlocked]){visibility:hidden}</style>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/design/assets/fonts/IBMPlexSans-Regular-Latin1.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/design/assets/fonts/IBMPlexSans-SemiBold-Latin1.woff2">

<link rel="stylesheet" href="/design/css/rux-overrides.css">
<link rel="stylesheet" href="../theme.css">
<!-- Not ../overrides.css: its grid and page padding rules are the schedule
     board's, and they take this page's margins away. -->
<!-- No theme.js: a customer's page is the company's, in Gray 100 for
     everyone, so a theme saved in this browser for the app never reaches
     it, and staff read it as the customer does. -->
</head>
<body>
<!-- A customer's tracking link, which opens without a log-in: track.js asks
     where the trip of the token in the address stands. While a leg is out
     the page goes on to Samsara's map of its bus, or lists the buses where
     there is more than one; otherwise it says when the map starts or that
     the trip has ended, laid out as Design's error state: what happened,
     then what to do. It names no driver, customer or stop. -->

<header class="rux--header" data-theme="g100" aria-label="Scheduler">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <!-- No address: someone who arrives by this link has nowhere in the app to
       go, so the logo is not a link. An <a> without href keeps Carbon's
       a.rux--header__name layout and is neither clickable nor a tab stop. -->
  <a class="rux--header__name"><img src="../brand/logo.png" alt="Escamilla Tour Buses" style="height:1.5rem;width:auto;flex:none"></a>
</header>

<main id="main-content" class="rux--content">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--sm:col-span-4 rux--md:col-span-6 rux--lg:col-span-8">
      <div class="rux--layer-two rux--stack-vertical rux--stack-scale-5" role="status" aria-live="polite">
        <h1 id="scheduler-share-title">Finding your bus…</h1>
        <p id="scheduler-share-text" hidden></p>
        <div id="scheduler-share-buses" class="rux--stack-vertical rux--stack-scale-3" hidden></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
