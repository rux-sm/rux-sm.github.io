<header class="rux--header" data-theme="g100" aria-label="Rux Sevens">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <a class="rux--header__name" href="./"><img src="/brand/logo.svg" alt="" style="height:1.5rem;width:auto;margin-right:.5rem;flex:none">
    <span class="rux--header__name--prefix">Rux</span>&nbsp;Sevens</a>
  <div class="rux--header__global">
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="Account" aria-expanded="false" aria-controls="rux-account-panel"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#i-user--avatar"/></svg></button>
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="App switcher" aria-expanded="false" aria-controls="rux-switcher-panel"><svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-grid"/></svg></button>
  </div>
  <div class="rux--header-panel" id="rux-switcher-panel">
    <ul class="rux--switcher" aria-label="Applications">
      <li class="rux--switcher__item"><a class="rux--switcher__item-link" href="/">Home</a></li>
      <li><hr class="rux--switcher__item--divider"></li>
      <li class="rux--switcher__item"><a class="rux--switcher__item-link" href="/sevens/" aria-current="page">Sevens</a></li>
    </ul>
  </div>
  <div class="rux--header-panel" id="rux-account-panel">
    <div class="rux--layer-two rux--stack-vertical rux--stack-scale-5">
      <div class="rux--form-item rux--text-input-wrapper">
        <div class="rux--text-input__label-wrapper">
          <label class="rux--label" for="rux-profile-name">Display name</label>
        </div>
        <div class="rux--text-input__field-outer-wrapper">
          <div class="rux--text-input__field-wrapper">
            <input id="rux-profile-name" class="rux--text-input" type="text" autocomplete="nickname" placeholder="Saved in this browser">
          </div>
        </div>
      </div>
      <div class="rux--form-item">
        <fieldset class="rux--radio-button-group rux--radio-button-group--label-right rux--radio-button-group--vertical" id="rux-profile-theme">
          <legend class="rux--label">Theme</legend>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-white" class="rux--radio-button" type="radio" name="rux-theme" value="white" checked>
            <label for="rux-theme-white" class="rux--radio-button__label">
              <span class="rux--radio-button__appearance"></span>
              <span class="rux--radio-button__label-text">White</span>
            </label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-g10" class="rux--radio-button" type="radio" name="rux-theme" value="g10">
            <label for="rux-theme-g10" class="rux--radio-button__label">
              <span class="rux--radio-button__appearance"></span>
              <span class="rux--radio-button__label-text">Gray 10</span>
            </label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-g90" class="rux--radio-button" type="radio" name="rux-theme" value="g90">
            <label for="rux-theme-g90" class="rux--radio-button__label">
              <span class="rux--radio-button__appearance"></span>
              <span class="rux--radio-button__label-text">Gray 90</span>
            </label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-g100" class="rux--radio-button" type="radio" name="rux-theme" value="g100">
            <label for="rux-theme-g100" class="rux--radio-button__label">
              <span class="rux--radio-button__appearance"></span>
              <span class="rux--radio-button__label-text">Gray 100</span>
            </label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-geist-dark" class="rux--radio-button" type="radio" name="rux-theme" value="geist-dark">
            <label for="rux-theme-geist-dark" class="rux--radio-button__label">
              <span class="rux--radio-button__appearance"></span>
              <span class="rux--radio-button__label-text">Geist dark</span>
            </label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-ant-dark" class="rux--radio-button" type="radio" name="rux-theme" value="ant-dark">
            <label for="rux-theme-ant-dark" class="rux--radio-button__label">
              <span class="rux--radio-button__appearance"></span>
              <span class="rux--radio-button__label-text">Ant dark</span>
            </label>
          </div>
          <div class="rux--radio-button-wrapper">
            <input id="rux-theme-spotify-dark" class="rux--radio-button" type="radio" name="rux-theme" value="spotify-dark">
            <label for="rux-theme-spotify-dark" class="rux--radio-button__label">
              <span class="rux--radio-button__appearance"></span>
              <span class="rux--radio-button__label-text">Spotify dark</span>
            </label>
          </div>
        </fieldset>
      </div>
      <button type="button" class="rux--btn rux--btn--tertiary" id="rux-profile-sign-in" hidden>Sign in</button>
    </div>
  </div>
</header>

<main id="main-content" class="rux--content">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--col-span-100">
      <div class="sevens-page">
        <div id="sevens-error" hidden>
          <div class="rux--inline-notification rux--inline-notification--error" role="alert">
            <div class="rux--inline-notification__details">
              <svg class="rux--inline-notification__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-error-fill"/></svg>
              <div class="rux--inline-notification__text-wrapper"><div class="rux--inline-notification__title"></div></div>
            </div>
          </div>
        </div>
        <h1 class="rux--visually-hidden">Table</h1>
        <div class="sevens-status"><strong id="sevens-round"></strong><span id="sevens-whose" aria-live="polite"></span></div>

        <section id="sevens-outside" class="rux--stack-vertical rux--stack-scale-5" hidden>
          <p id="sevens-outside-text"></p>
          <button type="button" class="rux--btn rux--btn--primary" id="sevens-join">Join this table</button>
          <a class="rux--link" href="./">Back to tables</a>
        </section>

        <section id="sevens-waiting" class="rux--stack-vertical rux--stack-scale-5" hidden>
          <div class="sevens-tables" id="sevens-seated"></div>
          <p class="sevens-math" id="sevens-start-note"></p>
          <div class="sevens-wide">
            <button type="button" class="rux--btn rux--btn--primary" id="sevens-start">Deal</button>
            <button type="button" class="rux--btn rux--btn--ghost" id="sevens-leave-waiting">Leave table</button>
          </div>
        </section>

        <section id="sevens-play" class="sevens-page" aria-label="Game" hidden>
          <div class="sevens-players" id="sevens-others"></div>
          <div class="sevens-center">
            <span class="sevens-card sevens-deck" id="sevens-deck" role="img"></span>
            <span class="sevens-feed" id="sevens-feed" aria-live="polite"></span>
          </div>
          <div class="sevens-you" id="sevens-you">
            <div class="sevens-sum"><strong>You</strong><span class="rux--type-productive-heading-04" id="sevens-points"></span></div>
            <div class="sevens-hand" id="sevens-hand"></div>
            <div class="sevens-math" id="sevens-math"></div>
          </div>
          <div class="sevens-you" id="sevens-choice" hidden>
            <div class="sevens-sum"><strong id="sevens-choice-title"></strong><span class="sevens-drawn" id="sevens-choice-card"></span></div>
            <p class="sevens-math" id="sevens-choice-help"></p>
            <div class="sevens-wide" id="sevens-choice-list"></div>
          </div>
          <div class="sevens-go" id="sevens-go">
            <button type="button" class="rux--btn rux--btn--primary rux--layout--size-xl" id="sevens-flip">Flip</button>
            <button type="button" class="rux--btn rux--btn--secondary rux--layout--size-xl" id="sevens-stay">Stay</button>
          </div>
          <div class="sevens-wide">
            <button type="button" class="rux--btn rux--btn--ghost" id="sevens-skip" hidden>Skip</button>
          </div>
        </section>

        <section id="sevens-scored" class="rux--stack-vertical rux--stack-scale-5" aria-labelledby="sevens-scored-title" hidden>
          <div class="sevens-sum"><h2 class="rux--type-productive-heading-03" id="sevens-scored-title"></h2><span class="sevens-math" id="sevens-scored-note"></span></div>
          <div class="sevens-scores" id="sevens-scores"></div>
          <div class="sevens-wide"><button type="button" class="rux--btn rux--btn--primary" id="sevens-deal">Deal</button></div>
        </section>

        <section id="sevens-finished" class="rux--stack-vertical rux--stack-scale-5" aria-labelledby="sevens-winner" hidden>
          <h2 class="rux--type-productive-heading-04" id="sevens-winner"></h2>
          <div class="sevens-scores" id="sevens-final"></div>
          <a class="rux--btn rux--btn--primary" href="./">Back to tables</a>
        </section>

        <section class="sevens-chat" aria-labelledby="sevens-h-chat">
          <h2 class="rux--type-productive-heading-02" id="sevens-h-chat">Chat</h2>
          <p class="sevens-math" id="sevens-chat-empty">Nothing said yet.</p>
          <div class="sevens-messages" id="sevens-messages" aria-live="polite"></div>
          <form class="sevens-say" id="sevens-say" autocomplete="off">
            <div class="rux--form-item rux--text-input-wrapper">
              <div class="rux--text-input__label-wrapper"><label class="rux--label rux--visually-hidden" for="sevens-say-input">Message</label></div>
              <div class="rux--text-input__field-outer-wrapper"><div class="rux--text-input__field-wrapper"><input id="sevens-say-input" class="rux--text-input" type="text" maxlength="500" placeholder="Message"></div></div>
            </div>
            <button type="submit" class="rux--btn rux--btn--primary">Send</button>
          </form>
        </section>

        <div class="sevens-wide"><button type="button" class="rux--btn rux--btn--danger--ghost" id="sevens-leave" data-rux-open="sevens-leave-modal" hidden>Leave game</button></div>
        <a class="rux--link" href="./">Tables</a>

        <div class="rux--layer-one rux--modal" id="sevens-leave-modal" role="presentation">
          <div role="dialog" aria-modal="true" aria-labelledby="sevens-leave-heading" tabindex="-1" class="rux--modal-container rux--modal-container--xs">
            <div class="rux--modal-header">
              <h2 class="rux--modal-header__heading" id="sevens-leave-heading">Leave this game?</h2>
              <div class="rux--modal-close-button">
                <button type="button" class="rux--modal-close" aria-label="Close" data-rux-close>
                  <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-close"/></svg>
                </button>
              </div>
            </div>
            <div class="rux--modal-content"><p>You are out for the rest of the game, and your cards are discarded.</p></div>
            <div class="rux--modal-footer">
              <button type="button" class="rux--btn rux--btn--secondary" data-rux-close>Stay in</button>
              <button type="button" class="rux--btn rux--btn--danger" id="sevens-leave-confirm" data-rux-close>Leave</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
