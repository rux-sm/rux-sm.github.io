<!-- The app tile icon, the same drawing as brand/favicon.svg: a pencil from
     its point at the bottom left to its eraser at the top right, one run of
     squares per row on the 16 grid the other apps' marks use. It is a CSS
     mask over the tile's text colour, so this file's own colours are
     discarded and only its alpha is read; that is why it carries no fill and
     no title. -->
