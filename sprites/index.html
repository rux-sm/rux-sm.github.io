     alone, no side nav. -->

<header class="rux--header" data-theme="g100" aria-label="Rux Sprites">
  <a class="rux--skip-to-content" href="#main-content">Skip to main content</a>
  <a class="rux--header__name" href="./"><img src="/brand/logo.svg" alt="" style="height:1.5rem;width:auto;margin-right:.17rem;flex:none">
    <span class="rux--header__name--prefix">Rux</span>&nbsp;Sprites</a>
  <div class="rux--header__global">
    <button type="button" class="rux--header__action rux--btn rux--layout--size-lg rux--btn--ghost rux--btn--icon-only" aria-label="Account" aria-expanded="false" aria-controls="rux-account-panel"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><use href="#i-user--avatar"/></svg></button>
  </div>
  <!-- ACCOUNT:BEGIN — generated, do not edit. `npm run build` rewrites this
       panel in every page from design/tools/lib/shell.mjs. -->
  <div class="rux--header-panel" id="rux-account-panel">
    <ul class="rux--switcher" aria-label="Account">
      <li class="rux--switcher__item" id="rux-account-profile" hidden><a class="rux--switcher__item-link" href="/account/">Profile</a></li>
      <li>
        <div class="rux--form-item">
          <div class="rux--select rux--select--inline rux--layout--size-md">
            <label class="rux--label" for="rux-profile-theme">Theme</label>
            <div class="rux--select-input--inline__wrapper">
              <div class="rux--select-input__wrapper">
                <select id="rux-profile-theme" class="rux--select-input">
                  <option class="rux--select-option" value="white" selected>White</option>
                  <option class="rux--select-option" value="g10">Gray 10</option>
                  <option class="rux--select-option" value="g90">Gray 90</option>
                  <option class="rux--select-option" value="g100">Gray 100</option>
                  <option class="rux--select-option" value="geist-dark">Geist dark</option>
                  <option class="rux--select-option" value="ant-dark">Ant dark</option>
                  <option class="rux--select-option" value="spotify-dark">Spotify dark</option>
                  <option class="rux--select-option" value="apple-light">Apple light</option>
                  <option class="rux--select-option" value="apple-dark">Apple dark</option>
                  <option class="rux--select-option" value="rux-dark">Rux dark</option>
                  <option class="rux--select-option" value="rux-100">Rux 100</option>
                  <option class="rux--select-option" value="pixel-dark">Pixel dark</option>
                </select>
                <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
              </div>
            </div>
          </div>
        </div>
      </li>
      <li class="rux--switcher__item" hidden><a class="rux--switcher__item-link" href="/login/" id="rux-profile-sign-in">Log out</a></li>
    </ul>
    <ul class="rux--switcher" aria-label="Applications">
      <li class="rux--switcher__item"><a class="rux--switcher__item-link" href="/">Home</a></li>
    </ul>
  </div>
  <!-- ACCOUNT:END -->
</header>

<main id="main-content" class="rux--content">
  <div class="rux--css-grid">
    <div class="rux--css-grid-column rux--col-span-100">
      <div class="sprites-page">
        <h1 class="rux--visually-hidden">Sprites</h1>
        <div id="sprites-notes" aria-live="polite"></div>

        <div class="sprites-bar" role="toolbar" aria-label="Tools">
          <div class="rux--content-switcher rux--layout--size-md rux--content-switcher--icon-only rux--layout-constraint--size__default-md rux--layout-constraint--size__min-sm rux--layout-constraint--size__max-lg" role="tablist" aria-label="Tool" id="sprites-tools">
      <span class="rux--content-switcher-popover__wrapper rux--content-switcher-popover--selected">
        <button type="button" class="rux--content-switcher-btn rux--content-switcher--selected rux--btn rux--btn--md rux--layout--size-md rux--btn--primary rux--btn--icon-only" role="tab" aria-selected="true" aria-label="Pencil (B)" title="Pencil (B)" tabindex="0" data-tool="pencil">
          <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-edit"/></svg>
        </button>
      </span>
      <span class="rux--content-switcher-popover__wrapper">
        <button type="button" class="rux--content-switcher-btn rux--btn rux--btn--md rux--layout--size-md rux--btn--primary rux--btn--icon-only" role="tab" aria-selected="false" aria-label="Eraser (E)" title="Eraser (E)" tabindex="-1" data-tool="eraser">
          <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-ink_eraser"/></svg>
        </button>
      </span>
      <span class="rux--content-switcher-popover__wrapper">
        <button type="button" class="rux--content-switcher-btn rux--btn rux--btn--md rux--layout--size-md rux--btn--primary rux--btn--icon-only" role="tab" aria-selected="false" aria-label="Fill (G)" title="Fill (G)" tabindex="-1" data-tool="fill">
          <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-format_color_fill"/></svg>
        </button>
      </span>
      <span class="rux--content-switcher-popover__wrapper">
        <button type="button" class="rux--content-switcher-btn rux--btn rux--btn--md rux--layout--size-md rux--btn--primary rux--btn--icon-only" role="tab" aria-selected="false" aria-label="Picker (I, or hold Alt)" title="Picker (I, or hold Alt)" tabindex="-1" data-tool="picker">
          <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-colorize"/></svg>
        </button>
      </span>
          </div>
          <div class="sprites-bar__group">
            <button type="button" class="rux--btn rux--btn--md rux--btn--ghost rux--btn--icon-only" id="sprites-mirror" aria-label="Mirror left to right (M)" title="Mirror left to right (M)" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-flip"/></svg></button>
          </div>
          <div class="sprites-bar__group">
            <button type="button" class="rux--btn rux--btn--md rux--btn--ghost rux--btn--icon-only" id="sprites-undo" aria-label="Undo (Cmd Z)" title="Undo (Cmd Z)" disabled><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-undo"/></svg></button>
            <button type="button" class="rux--btn rux--btn--md rux--btn--ghost rux--btn--icon-only" id="sprites-redo" aria-label="Redo (Shift Cmd Z)" title="Redo (Shift Cmd Z)" disabled><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-redo"/></svg></button>
          </div>
          <div class="sprites-bar__group">
            <button type="button" class="rux--btn rux--btn--md rux--btn--ghost rux--btn--icon-only" id="sprites-zoom-out" aria-label="Zoom out (−)" title="Zoom out (−)"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-zoom_out"/></svg></button>
            <span class="rux--type-body-compact-01 sprites-zoom" id="sprites-zoom" aria-live="polite">1×</span>
            <button type="button" class="rux--btn rux--btn--md rux--btn--ghost rux--btn--icon-only" id="sprites-zoom-in" aria-label="Zoom in (+)" title="Zoom in (+)"><svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-zoom_in"/></svg></button>
          </div>
          <div class="sprites-bar__group sprites-bar__end">
            <button type="button" class="rux--btn rux--btn--md rux--btn--ghost" data-rux-open="sprites-size-modal" id="sprites-size">Size</button>
            <button type="button" class="rux--btn rux--btn--md rux--btn--secondary" id="sprites-open">Open</button>
            <button type="button" class="rux--btn rux--btn--md rux--btn--primary" id="sprites-save">Save</button>
          </div>
        </div>

        <div class="sprites-work">
          <div class="sprites-stage" id="sprites-stage">
            <canvas class="sprites-canvas" id="sprites-canvas" aria-label="The drawing" role="img"></canvas>
          </div>
          <aside class="sprites-side" aria-label="Colours">
            <section class="rux--stack-vertical rux--stack-scale-3" aria-labelledby="sprites-h-colour">
              <h2 class="rux--type-heading-compact-01" id="sprites-h-colour">Colour</h2>
              <div class="sprites-current">
                <span class="sprites-swatch sprites-swatch--current" id="sprites-current" aria-hidden="true"></span>
                <span class="rux--type-body-compact-01" id="sprites-current-name"></span>
              </div>
          <div class="rux--form-item">
            <div class="rux--select rux--layout--size-md">
              <label class="rux--label" for="sprites-palette">Palette</label>
              <div class="rux--select-input__wrapper">
                <select id="sprites-palette" class="rux--select-input">
                <option class="rux--select-option" value="sprites">Sprites</option>
                <option class="rux--select-option" value="emu-consoles">Emu consoles</option>
                </select>
                <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
              </div>
            </div>
          </div>
              <div class="sprites-ramps" id="sprites-ramps" role="group" aria-label="Palette colours"></div>
              <div class="sprites-free" id="sprites-free">
                <label class="rux--label" for="sprites-colour-field">Any colour</label>
                <div class="sprites-free__row">
                  <input type="color" class="sprites-free__field" id="sprites-colour-field" value="#e81013">
                  <div class="sprites-ramp" id="sprites-recent" role="group" aria-label="Recent colours"></div>
                </div>
              </div>
            </section>
            <section class="rux--stack-vertical rux--stack-scale-3" aria-labelledby="sprites-h-drawing">
              <h2 class="rux--type-heading-compact-01" id="sprites-h-drawing">Drawing</h2>
              <p class="rux--type-body-compact-01" id="sprites-size-text"></p>
              <p class="rux--type-code-01 sprites-path" id="sprites-path"></p>
              <p class="rux--type-helper-text-01" id="sprites-where"></p>
            </section>
          </aside>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Size, from the bar: a preset or any size; Resize keeps the drawing,
     anchored to its bottom left, and New starts a blank one. Both are steps
     Undo takes back. -->
<div class="rux--layer-one rux--modal" id="sprites-size-modal" role="presentation">
  <div role="dialog" aria-modal="true" aria-labelledby="sprites-size-h" tabindex="-1" class="rux--modal-container rux--modal-container--sm">
    <div class="rux--modal-header">
      <h2 class="rux--modal-header__heading" id="sprites-size-h">Size</h2>
      <div class="rux--modal-close-button">
        <button type="button" class="rux--modal-close" aria-label="Close" data-rux-close>
          <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-close"/></svg>
        </button>
      </div>
    </div>
    <div class="rux--modal-content">
      <div class="rux--stack-vertical rux--stack-scale-5">
          <div class="rux--form-item">
            <div class="rux--select rux--layout--size-md">
              <label class="rux--label" for="sprites-preset">Preset</label>
              <div class="rux--select-input__wrapper">
                <select id="sprites-preset" class="rux--select-input">
                <option class="rux--select-option" value="home">Emu home console, 36 × 24</option>
                <option class="rux--select-option" value="handheld">Emu handheld, 24 high</option>
                <option class="rux--select-option" value="icon16">Icon, 16 × 16</option>
                <option class="rux--select-option" value="icon32">Icon, 32 × 32</option>
                <option class="rux--select-option" value="free">Free size</option>
                </select>
                <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
              </div>
            <div class="rux--form__helper-text" id="sprites-preset-help">Resize keeps the drawing anchored to its bottom left.</div>
            </div>
          </div>
        <div class="sprites-size-fields">
          <div class="rux--form-item">
            <div class="rux--number rux--number--lg">
              <label class="rux--label" for="sprites-width">Width</label>
              <div class="rux--number__input-wrapper">
                <input id="sprites-width" type="number" min="1" max="256" step="1" value="16">
                <div class="rux--number__controls">
                  <button type="button" class="rux--number__control-btn down-icon" aria-label="Decrement">
                    <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-subtract"/></svg>
                  </button>
                  <div class="rux--number__rule-divider"></div>
                  <button type="button" class="rux--number__control-btn up-icon" aria-label="Increment">
                    <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-add"/></svg>
                  </button>
                  <div class="rux--number__rule-divider"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="rux--form-item">
            <div class="rux--number rux--number--lg">
              <label class="rux--label" for="sprites-height">Height</label>
              <div class="rux--number__input-wrapper">
                <input id="sprites-height" type="number" min="1" max="256" step="1" value="16">
                <div class="rux--number__controls">
                  <button type="button" class="rux--number__control-btn down-icon" aria-label="Decrement">
                    <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-subtract"/></svg>
                  </button>
                  <div class="rux--number__rule-divider"></div>
                  <button type="button" class="rux--number__control-btn up-icon" aria-label="Increment">
                    <svg width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-add"/></svg>
                  </button>
                  <div class="rux--number__rule-divider"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="rux--modal-footer">
      <button type="button" class="rux--btn rux--btn--secondary" id="sprites-resize">Resize</button>
      <button type="button" class="rux--btn rux--btn--primary" id="sprites-new">New drawing</button>
    </div>
  </div>
</div>

<!-- Save, from the bar or Cmd S: a path in the checkout and a format.
     files.js writes it there in Chrome and downloads it elsewhere. -->
<div class="rux--layer-one rux--modal" id="sprites-save-modal" role="presentation">
  <div role="dialog" aria-modal="true" aria-labelledby="sprites-save-h" tabindex="-1" class="rux--modal-container rux--modal-container--sm">
    <div class="rux--modal-header">
      <h2 class="rux--modal-header__heading" id="sprites-save-h">Save</h2>
      <div class="rux--modal-close-button">
        <button type="button" class="rux--modal-close" aria-label="Close" data-rux-close>
          <svg class="rux--modal-close__icon" width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#m-close"/></svg>
        </button>
      </div>
    </div>
    <div class="rux--modal-content">
      <div class="rux--stack-vertical rux--stack-scale-5">
        <div class="rux--form-item rux--text-input-wrapper">
          <div class="rux--text-input__label-wrapper">
            <label class="rux--label" for="sprites-save-path">Path in the checkout</label>
          </div>
          <div class="rux--text-input__field-outer-wrapper">
            <div class="rux--text-input__field-wrapper" id="sprites-save-path-wrap">
              <svg class="rux--text-input__invalid-icon" id="sprites-save-path-icon" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" hidden><use href="#i-warning--filled"/></svg>
              <input id="sprites-save-path" class="rux--text-input" type="text" placeholder="emu/brand/consoles/snes.png" autocomplete="off" spellcheck="false">
            </div>
            <div class="rux--form-requirement" id="sprites-save-error"></div>
            <div class="rux--form__helper-text" id="sprites-save-help"></div>
          </div>
        </div>
          <div class="rux--form-item">
            <div class="rux--select rux--layout--size-md">
              <label class="rux--label" for="sprites-format">Format</label>
              <div class="rux--select-input__wrapper">
                <select id="sprites-format" class="rux--select-input">
                <option class="rux--select-option" value="png1">PNG</option>
                <option class="rux--select-option" value="png2">PNG at 2×</option>
                <option class="rux--select-option" value="png4">PNG at 4×</option>
                <option class="rux--select-option" value="png8">PNG at 8×</option>
                <option class="rux--select-option" value="svg">SVG</option>
                </select>
                <svg class="rux--select__arrow" width="16" height="16" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><use href="#i-chevron--down"/></svg>
              </div>
            </div>
          </div>
      </div>
    </div>
    <div class="rux--modal-footer">
      <button type="button" class="rux--btn rux--btn--secondary" data-rux-close>Cancel</button>
      <button type="button" class="rux--btn rux--btn--primary" id="sprites-save-go">Save</button>
    </div>
  </div>
</div>
